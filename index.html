<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f0e8"><link rel="manifest" href="manifest.webmanifest"><title>たぬっき</title><style>
:root{--bg:#f5f0e8;--paper:#fffcf7;--ink:#4d4842;--muted:#8e8479;--line:#e7ddd0;--accent:#b57e6b;--sage:#85937e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.shell{max-width:560px;margin:auto;min-height:100dvh;padding:18px 16px 105px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.logo{font-size:28px;font-weight:650;letter-spacing:.08em}.subtitle{font-size:11px;color:var(--muted)}.pill{background:#eae1d6;border-radius:30px;padding:9px 13px;color:var(--ink)}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #65503b09}.card h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}.card h2 button{color:var(--accent);background:#f4ebe3;padding:7px 11px;border-radius:15px;font-size:12px}.monthhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.monthhead button{background:#f0e8de;border-radius:10px;padding:7px 13px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal button,.cal span{min-height:40px;background:transparent;border-radius:11px;position:relative;padding:5px 0}.cal .dow{min-height:25px;font-size:11px;color:var(--muted)}.cal button.today{outline:1px solid var(--accent)}.cal button.sel{background:var(--accent);color:white}.cal button.has:after{content:'•';position:absolute;bottom:0;left:calc(50% - 3px);font-size:13px;color:var(--sage)}.cal button.sel.has:after{color:white}.dayhead{display:flex;justify-content:space-between;align-items:center;margin:18px 3px 4px}.dayhead strong{font-size:19px}.muted{color:var(--muted);font-size:12px}.entry{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.entry:first-of-type{border-top:0}.entry .main{flex:1;min-width:0}.entry .main strong{font-size:14px;font-weight:600}.entry small{color:var(--muted);font-size:11px;display:block;margin-top:4px}.time{min-width:50px;color:var(--muted);font-size:12px}.tiny{background:#f0e8de;border-radius:12px;padding:6px 9px;font-size:12px}.empty{color:var(--muted);text-align:center;font-size:13px;padding:12px}.check{width:20px;height:20px;accent-color:var(--sage)}.done{text-decoration:line-through;color:#aaa}.stampgrid{display:flex;gap:8px;flex-wrap:wrap}.stamp{background:#f2ece4;border-radius:15px;padding:10px 12px;font-size:13px}.stamp.active{background:#dfe8da;outline:2px solid var(--sage)}nav{position:fixed;bottom:0;left:0;right:0;background:#f5f0e8ed;backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:10px 4px calc(10px + env(safe-area-inset-bottom))}nav>div{display:flex;width:min(560px,100%);justify-content:space-around}nav button{background:transparent;color:var(--muted);font-size:12px;padding:8px}nav button.active{color:var(--accent);font-weight:700}.hide{display:none!important}.overlay{position:fixed;inset:0;background:#27221e77;z-index:5;display:flex;align-items:end;justify-content:center}.sheet{background:var(--paper);width:min(560px,100%);max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(25px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 16px;font-size:19px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#faf7f2;border-radius:12px;padding:12px;color:var(--ink)}.field input[type=checkbox]{width:auto}.field textarea{min-height:70px}.buttons{display:flex;gap:9px;margin-top:18px}.buttons button{flex:1;padding:12px;border-radius:13px;background:#ece4da}.buttons button.primary{background:var(--accent);color:white}.hint{font-size:12px;color:var(--muted);line-height:1.7}.quick{display:flex;flex-wrap:wrap;gap:7px}.quick button{background:#eee7dd;border-radius:12px;padding:7px 10px;font-size:12px}.switch{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.switch button{background:#efe8df;padding:9px 12px;border-radius:14px}.switch button.active{background:var(--accent);color:white}
</style></head><body><div class="shell"><header><div><div class="logo">たぬっき <span style="font-size:22px">🍂</span></div><div class="subtitle">たぬの日々を、すこしずつ。</div></div><button class="pill" id="settings">設定</button></header><div id="home"><section class="card"><div class="monthhead"><button id="prev">‹</button><strong id="monthTitle"></strong><button id="next">›</button></div><div class="cal" id="calendar"></div></section><div class="dayhead"><strong id="dateTitle"></strong><button class="pill" id="today">今日に戻る</button></div><section class="card"><h2>今日の予定 <button data-add="event">＋ 追加</button></h2><div id="events"></div></section><section class="card"><h2>やること <button data-add="task">＋ 追加</button></h2><div id="tasks"></div></section><section class="card"><h2>体調スタンプ <button id="editStamps">⚙ カスタマイズ</button></h2><div class="stampgrid" id="stamps"></div><p class="hint">選んだ日の記録。もう一度押すと解除できます。</p></section></div><div id="other" class="hide"></div></div><nav><div><button data-view="home" class="active">⌂ ホーム</button><button data-view="tasks">☑ TODO</button><button data-view="wishes">♡ やりたい</button><button data-view="visions">✧ いつか</button></div></nav><div id="overlay" class="overlay hide"><div class="sheet" id="sheet"></div></div><script>
'use strict';const KEY='tanukki-data-v1';const blank=()=>({events:[],tasks:[],wishes:[],visions:[],stamps:[{id:'headache',name:'頭痛',emoji:'🤕'},{id:'period',name:'生理',emoji:'🌙'},{id:'sleepy',name:'眠気',emoji:'💤'},{id:'good',name:'好調',emoji:'🌿'}],health:{}});let db;try{db=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{db=blank()}const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');let date=new Date(),view='home';date.setHours(0,0,0,0);const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const close=()=>$('overlay').classList.add('hide');function show(html){$('sheet').innerHTML=html;$('overlay').classList.remove('hide')};$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('home').classList.toggle('hide',view!=='home');$('other').classList.toggle('hide',view==='home');if(view==='home')renderHome();else renderOther()};function renderHome(){const y=date.getFullYear(),m=date.getMonth(),s=iso(date);$('monthTitle').textContent=`${y}年 ${m+1}月`;$('dateTitle').textContent=`${m+1}月${date.getDate()}日（${'日月火水木金土'[date.getDay()]}）`;let c='日月火水木金土'.split('').map(x=>`<span class="dow">${x}</span>`).join('');for(let i=0;i<new Date(y,m,1).getDay();i++)c+='<span></span>';for(let n=1;n<=new Date(y,m+1,0).getDate();n++){let d=new Date(y,m,n),k=iso(d);c+=`<button data-day="${k}" class="${k===s?'sel ':''}${k===iso(new Date())?'today ':''}${db.events.some(e=>e.date===k)||db.health[k]?.length?'has':''}">${n}</button>`}$('calendar').innerHTML=c;const ev=db.events.filter(e=>e.date===s).sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('events').innerHTML=ev.map(e=>`<div class="entry"><span class="time">${esc(e.time||'未定')}</span><div class="main"><strong>${esc(e.title)}</strong><small>${e.visibility==='private'?'🔒 自分だけ':e.visibility==='busy'?'時間だけ共有':'共有予定'}${e.note?' · '+esc(e.note):''}</small></div><button class="tiny" data-edit="event" data-id="${e.id}">編集</button></div>`).join('')||'<div class="empty">予定はありません</div>';$('tasks').innerHTML=taskHTML(db.tasks.filter(t=>!t.done).slice(0,5))||'<div class="empty">TODOはありません</div>';$('stamps').innerHTML=db.stamps.map(x=>`<button class="stamp ${(db.health[s]||[]).includes(x.id)?'active':''}" data-stamp="${x.id}">${esc(x.emoji)} ${esc(x.name)}</button>`).join('')||'<div class="empty">スタンプを追加してね</div>'};function taskHTML(arr){return arr.map(t=>`<div class="entry"><input type="checkbox" class="check" data-check="${t.id}" ${t.done?'checked':''}><div class="main ${t.done?'done':''}"><strong>${esc(t.title)}</strong><small>${t.private?'🔒 自分だけ':'個人のTODO'}${t.due?' · '+esc(t.due):' · 期限なし'}</small></div><button class="tiny" data-edit="task" data-id="${t.id}">編集</button></div>`).join('')};function renderOther(){let title={tasks:'TODO',wishes:'やりたいこと',visions:'いつか叶えたいこと'}[view],list=db[view];$('other').innerHTML=`<section class="card"><h2>${title}<button data-add="${view==='tasks'?'task':view}">＋ 追加</button></h2>${view==='tasks'?taskHTML(list):list.map(x=>`<div class="entry"><div class="main"><strong>${esc(x.title)}</strong><small>${x.private?'🔒 自分だけ':'個人のリスト'}</small></div><button class="tiny" data-promote="${view}" data-id="${x.id}">TODOへ</button><button class="tiny" data-edit="${view}" data-id="${x.id}">編集</button></div>`).join('')}${list.length?'':'<div class="empty">まだ何もありません</div>'}</section>`};function eventForm(item){let e=item||{title:'',date:iso(date),time:'',note:'',visibility:'private',reminders:[]};show(`<h2>${item?'予定を編集':'予定を追加'}</h2><form id="editform"><div class="field"><label>予定名</label><input name="title" required maxlength="100" value="${esc(e.title)}" placeholder="例：通院、友だちと会う"></div><div class="field"><label>日付</label><input type="date" name="date" required value="${esc(e.date)}"></div><div class="field"><label>時刻（未定なら空欄でOK）</label><input type="time" name="time" value="${esc(e.time)}"></div><div class="field"><label>メモ</label><textarea name="note">${esc(e.note)}</textarea></div><div class="field"><label>共有範囲（現在は共有機能未接続）</label><select name="visibility"><option value="private" ${e.visibility==='private'?'selected':''}>自分だけ</option><option value="busy" ${e.visibility==='busy'?'selected':''}>時間だけ共有</option><option value="shared" ${e.visibility==='shared'?'selected':''}>内容も共有</option></select></div><div class="field"><label>リマインダー（複数選択可・試験版はアプリ起動中のみ）</label><div class="quick" id="reminderOptions">${[[10,'10分前'],[60,'1時間前'],[1440,'前日・同時刻'],[2880,'2日前']].map(([v,l])=>`<label><input type="checkbox" value="${v}" ${e.reminders?.includes(v)?'checked':''}> ${l}</label>`).join('')}</div></div><div class="buttons"><button type="button" id="cancel">戻る</button><button class="primary">保存</button></div>${item?'<div class="buttons"><button type="button" id="delete">削除</button></div>':''}</form>`);$('cancel').onclick=close;$('editform').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target),obj={id:item?.id||uid(),title:f.get('title').trim(),date:f.get('date'),time:f.get('time'),note:f.get('note'),visibility:f.get('visibility'),reminders:[...$('reminderOptions').querySelectorAll('input:checked')].map(x=>Number(x.value))};if(item)Object.assign(item,obj);else db.events.push(obj);save();close();render()};if(item)$('delete').onclick=()=>{if(confirm('この予定を削除しますか？')){db.events=db.events.filter(x=>x.id!==item.id);save();close();render()}}};function itemForm(kind,item){let key=kind==='task'?'tasks':kind;show(`<h2>${item?'編集':({tasks:'TODO',wishes:'やりたいこと',visions:'いつか叶えたいこと'}[key]+'を追加')}</h2><form id="editform"><div class="field"><label>内容</label><textarea name="title" required maxlength="200">${esc(item?.title||'')}</textarea></div>${key==='tasks'?`<div class="field"><label>期限（任意）</label><input type="date" name="due" value="${esc(item?.due||'')}"></div>`:''}<div class="field"><label><input type="checkbox" name="private" ${item?.private?'checked':''}> 自分だけの項目</label></div><div class="buttons"><button type="button" id="cancel">戻る</button><button class="primary">保存</button></div>${item?'<div class="buttons"><button type="button" id="delete">削除</button></div>':''}</form>`);$('cancel').onclick=close;$('editform').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target),obj={id:item?.id||uid(),title:f.get('title').trim(),private:f.get('private')==='on'};if(key==='tasks'){obj.done=item?.done||false;obj.due=f.get('due')||''}if(item)Object.assign(item,obj);else db[key].push(obj);save();close();render()};if(item)$('delete').onclick=()=>{if(confirm('削除しますか？')){db[key]=db[key].filter(x=>x.id!==item.id);save();close();render()}}};function stampSettings(){show(`<h2>体調スタンプの設定</h2><p class="hint">スタンプはこの端末の個人用です。名前と絵文字を自由に決められます。</p><div id="stampList">${db.stamps.map(x=>`<div class="entry"><div class="main"><strong>${esc(x.emoji)} ${esc(x.name)}</strong></div><button class="tiny" data-remove-stamp="${x.id}">削除</button></div>`).join('')}</div><form id="stampForm"><div class="field"><label>絵文字</label><input name="emoji" maxlength="8" value="🌸" required></div><div class="field"><label>スタンプ名</label><input name="name" maxlength="25" placeholder="例：肩こり" required></div><div class="buttons"><button type="button" id="cancel">閉じる</button><button class="primary">スタンプを追加</button></div></form>`);$('cancel').onclick=close;$('stampForm').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target);db.stamps.push({id:uid(),emoji:f.get('emoji').trim(),name:f.get('name').trim()});save();stampSettings();render()};$('stampList').onclick=ev=>{let b=ev.target.closest('[data-remove-stamp]');if(b&&confirm('スタンプを削除しますか？')){db.stamps=db.stamps.filter(x=>x.id!==b.dataset.removeStamp);save();stampSettings();render()}}};function settings(){show(`<h2>たぬっきの設定</h2><p class="hint">保存先はこのブラウザの端末内です。ブラウザデータの削除で消える可能性があるため、バックアップをおすすめします。家族共有やバックグラウンド通知はまだありません。</p><div class="buttons"><button id="export">バックアップ保存</button><button id="importButton">読み込む</button></div><input type="file" id="importFile" accept="application/json" class="hide"><div class="buttons"><button id="notifications">通知を許可する</button><button id="test">10秒後にテスト</button></div><p class="hint" id="notificationStatus">通知は対応ブラウザのHTTPS環境でのみ許可でき、アプリを閉じた状態での通知はまだ未対応です。</p><div class="buttons"><button id="reset">すべて消去</button><button id="cancel">閉じる</button></div>`);$('cancel').onclick=close;$('export').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tanukki-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=ev=>{let file=ev.target.files[0];if(!file)return;file.text().then(t=>{try{let d=JSON.parse(t);if(!Array.isArray(d.events)||!Array.isArray(d.tasks)||!Array.isArray(d.stamps))throw Error();if(confirm('現在のデータをバックアップで置き換えますか？')){db=Object.assign(blank(),d);save();close();render()}}catch{alert('バックアップの形式を確認してください')}})};$('notifications').onclick=async()=>{if(!('Notification'in window))return alert('このブラウザは通知に対応していません');try{let r=await Notification.requestPermission();$('notificationStatus').textContent='通知の状態: '+r}catch{alert('この環境では通知を許可できません')}};$('test').onclick=()=>{setTimeout(()=>notify('たぬっき','テスト通知だよ。'),10000);$('notificationStatus').textContent='アプリを開いたまま10秒待ってね'};$('reset').onclick=()=>{if(confirm('すべてのデータを削除しますか？')){db=blank();save();close();render()}}};function notify(title,body){if('Notification'in window&&Notification.permission==='granted'){try{new Notification(title,{body,icon:'icon.svg'})}catch{alert(body)}}else alert(body)}const notified=new Set();function checkReminders(){let now=Date.now();for(let e of db.events){if(!e.time)continue;let when=new Date(`${e.date}T${e.time}:00`).getTime();for(let mins of e.reminders||[]){let target=when-mins*60000,k=e.id+':'+mins+':'+target;if(now>=target&&now<target+60000&&!notified.has(k)){notified.add(k);notify('たぬっき：'+e.title,mins>=1440?`${mins/1440}日前のお知らせ`:mins>=60?`${mins/60}時間前のお知らせ`:`${mins}分前のお知らせ`)}}}}setInterval(checkReminders,15000);document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.day){date=new Date(b.dataset.day+'T00:00:00');render()}else if(b.dataset.add){b.dataset.add==='event'?eventForm():itemForm(b.dataset.add)}else if(b.dataset.edit){let key=b.dataset.edit==='event'?'events':b.dataset.edit==='task'?'tasks':b.dataset.edit,item=db[key].find(x=>x.id===b.dataset.id);if(item)b.dataset.edit==='event'?eventForm(item):itemForm(b.dataset.edit,item)}else if(b.dataset.stamp){let k=iso(date),a=db.health[k]||[];db.health[k]=a.includes(b.dataset.stamp)?a.filter(x=>x!==b.dataset.stamp):[...a,b.dataset.stamp];save();render()}else if(b.dataset.view){view=b.dataset.view;render()}else if(b.dataset.promote){let k=b.dataset.promote,item=db[k].find(x=>x.id===b.dataset.id);if(item){db.tasks.push({id:uid(),title:item.title,private:item.private,done:false,due:''});db[k]=db[k].filter(x=>x.id!==item.id);save();view='tasks';render()}}});document.addEventListener('change',e=>{if(e.target.dataset.check){let t=db.tasks.find(x=>x.id===e.target.dataset.check);if(t){t.done=e.target.checked;save();render()}}});$('prev').onclick=()=>{date=new Date(date.getFullYear(),date.getMonth()-1,Math.min(date.getDate(),28));render()};$('next').onclick=()=>{date=new Date(date.getFullYear(),date.getMonth()+1,Math.min(date.getDate(),28));render()};$('today').onclick=()=>{date=new Date();date.setHours(0,0,0,0);render()};$('editStamps').onclick=stampSettings;$('settings').onclick=settings;if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
