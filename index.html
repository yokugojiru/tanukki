</style></head><body><div class="shell"><header><div><div class="logo">たぬっき <span class="brand-mark">✧</span></div><div class="subtitle">たぬの日々を、すこしずつ。 <span id="tanupoBadge" class="tanupo-badge">✦ 0 たぬぽ</span></div></div><div class="header-actions"><button class="tiny" data-view="health">♡ 体調</button><button class="tiny" data-view="share">♧ 共有</button><button class="tiny" id="settings">☷ 設定</button></div></header><div id="home"><section class="vision-strip" id="visionCard"><span class="vision-label">✧ いつかの楽しみ</span><span id="visionPreview" class="vision-text"></span><button id="shuffleVision" aria-label="別の目標">↻</button></section><section class="card calendar-card"><div class="monthhead"><button id="prev">‹</button><strong id="monthTitle"></strong><button id="next">›</button></div><div class="cal" id="calendar"></div></section><div class="dayhead"><strong id="dateTitle"></strong><div class="daynav"><button class="tiny" id="dayPrev" aria-label="前日">‹</button><button class="tiny" id="today">今日</button><button class="tiny" id="dayNext" aria-label="翌日">›</button></div></div><section class="card"><h2>予定 <button data-add="event">＋ 追加</button></h2><div id="events"></div></section><section class="card"><h2>やること <button data-add="task">＋ 追加</button></h2><div id="tasks"></div></section></div><div id="other" class="hide"></div></div><nav aria-label="ダイヤル式タブ"><div class="dial-track" id="dialTrack"><button type="button" id="dialPrev" aria-label="前のタブ">‹</button><button type="button" id="dialCurrent" aria-label="現在のタブ">⌂ ホーム</button><button type="button" id="dialNext" aria-label="次のタブ">やること ›</button></div><div class="dial-hint">左右にスワイプ、または左右をタップ</div></nav><div id="overlay" class="overlay hide"><div class="sheet" id="sheet"></div></div><script>

function taskHTML(arr){return arr.map(t=>`<div class="entry"><input aria-label="完了" type="checkbox" class="check" data-check="${esc(t.id)}" ${t.done?'checked':''}><div class="main ${t.done?'done':''}"><strong>${esc(t.title)}</strong><small><span class="tag">${esc(t.category||'未分類')}</span>${t.due?'期限 '+esc(t.due):'期限なし'}${t.repeat?' · 繰り返し '+esc(t.repeat):''}${t.reminderAt?' · 🔔 '+esc(t.reminderAt.replace('T',' ')):''}</small></div><button class="tiny" data-edit="task" data-id="${esc(t.id)}">編集</button></div>`).join('')}
function renderHome(){renderCalendar();$('dateTitle').textContent=dateLabel(date);const s=iso(date);let ev=db.events.filter(e=>e.date===s||isSpanOn(e,s)||isRepeatOn(e,s)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('events').innerHTML=ev.map(e=>`<div class="entry"><span class="colorbar" style="background:${catColor(e.category)}"></span><span class="time">${esc(e.time||'未定')}</span><div class="main"><strong>${esc(e.title)}</strong><small><span class="tag">${esc(e.category||'私用')}</span>${e.visibility==='private'?'🔒 自分だけ':e.visibility==='busy'?'時間のみ共有予定':'共有予定'}${e.repeat?' · ↻ '+esc(e.repeat):''}${e.note?' · '+esc(e.note):''}</small></div><button class="tiny" data-share-event="${esc(e.id)}">共有へ</button><button class="tiny" data-copy="${esc(e.id)}">複製</button><button class="tiny" data-edit="event" data-id="${esc(e.id)}">編集</button></div>`).join('')||'<div class="empty">予定はありません</div>';const tasks=db.tasks.filter(t=>(!t.done||cfg.showDone)&&(t.done||!t.due||t.due<=s||isRepeatOn(t,s))).slice(0,12);$('tasks').innerHTML=taskHTML(tasks)||'<div class="empty">TODOはありません</div>';const goals=db.visions;if(!cfg.showVision){$('visionCard').classList.add('hide')}else{$('visionCard').classList.remove('hide');if(!goals.length){$('visionPreview').textContent='「いつか」に目標を登録すると、ここに表示されるよ。';$('shuffleVision').hidden=true}else{if(!goals.some(g=>g.id===visionId))visionId=goals[Math.floor(Math.random()*goals.length)].id;$('visionPreview').textContent=goals.find(g=>g.id===visionId).title;$('shuffleVision').hidden=goals.length<2}}}
function isRepeatOn(e,k){if(!e.repeat||e.repeat==='none'||!e.date||k<e.date)return false;let a=new Date(e.date+'T12:00:00'),b=new Date(k+'T12:00:00');let days=Math.round((b-a)/86400000);if(days<=0)return false;if(e.repeat==='daily')return true;if(e.repeat==='weekly')return days%7===0;if(e.repeat==='monthly')return a.getDate()===b.getDate();return false}
function renderOther(){if(view==='share'){renderShare();return}if(view==='health'){renderHealth();return}const titles={tasks:'TODO',wishes:'やりたいこと',visions:'いつか叶えたいこと'},key=view,list=db[key];$('other').innerHTML=`<section class="card"><h2>${titles[key]} <button data-add="${key==='tasks'?'task':key}">＋ 追加</button></h2>${key==='tasks'?taskHTML(list.filter(x=>!x.done||cfg.showDone)):list.map(x=>`<div class="entry"><div class="main"><strong>${esc(x.title)}</strong><small><span class="tag">${esc(x.category||'未分類')}</span>個人のリスト</small></div><button class="tiny" data-promote="${key}" data-id="${esc(x.id)}">TODOへ</button><button class="tiny" data-edit="${key}" data-id="${esc(x.id)}">編集</button></div>`).join('')}${list.length?'':'<div class="empty">まだ何もありません</div>'}</section>`}
function renderHealth(){let s=iso(date),w=db.weights[s]??'',vals=Object.entries(db.weights).filter(([d,v])=>Number.isFinite(Number(v))&&Number(v)>0).sort(([a],[b])=>a.localeCompare(b)).slice(-14);let graph='';if(vals.length){let nums=vals.map(x=>Number(x[1])),lo=Math.min(...nums)-1,hi=Math.max(...nums)+1;graph=`<div class="mini-chart">${vals.map(([d,v])=>`<div class="bar" title="${esc(d)}: ${esc(v)}kg" style="height:${Math.max(6,((Number(v)-lo)/(hi-lo))*90)}px"></div>`).join('')}</div><div class="chartmeta"><span>${esc(vals[0][0])}</span><span>${esc(vals[vals.length-1][0])}</span></div><p class="hint">直近${vals.length}件 · 最小 ${Math.min(...nums)}kg / 最大 ${Math.max(...nums)}kg</p>`}else graph='<p class="empty">体重を記録するとグラフが出るよ</p>';$('other').innerHTML=`<section class="card health-calendar-card"><div class="monthhead"><button data-health-month="-1">‹</button><strong>${date.getFullYear()}年 ${date.getMonth()+1}月</strong><button data-health-month="1">›</button></div><div class="cal">${calendarHTML(true)}</div></section><div class="dayhead"><strong>${dateLabel(date)}</strong><div class="daynav"><button class="tiny" data-shift="-1">‹</button><button class="tiny" data-shift="0">今日</button><button class="tiny" data-shift="1">›</button></div></div><section class="card"><h2>体調スタンプ <button id="editStampsHealth">⚙ 編集</button></h2><div class="stampgrid">${db.stamps.map(x=>`<button class="stamp ${(db.health[s]||[]).includes(x.id)?'active':''}" data-stamp="${esc(x.id)}">${esc(x.emoji)} ${esc(x.name)}</button>`).join('')}</div></section><section class="card"><h2>この日のメモ <span class="muted">任意</span></h2><form id="healthNoteForm"><div class="field"><div class="template-buttons"><button type="button" data-health-template="睡眠：\n気分：\n症状：">睡眠・気分・症状</button><button type="button" data-health-template="きっかけ：\n症状：\n対処：">症状の振り返り</button></div><textarea class="health-note" name="memo"  maxlength="2000" placeholder="気になったことだけ、ひとことでも。">${esc(db.healthNotes?.[s]||'')}</textarea></div><div class="buttons"><button class="primary">メモを保存</button></div></form></section><section class="card"><h2>体重の記録</h2><form id="weightForm"><div class="field"><label>体重（kg）・空欄で記録を削除</label><input name="weight" type="number" step="0.1" min="1" max="500" inputmode="decimal" value="${esc(w)}" placeholder="例：58.2"></div><div class="buttons"><button class="primary">この日の記録を保存</button></div></form></section><section class="card"><h2>体重の推移</h2>${graph}</section><p class="notice">体調と体重の記録は、この端末内に保存されます。家族共有機能はまだありません。</p>`;$('weightForm').onsubmit=e=>{e.preventDefault();let raw=new FormData(e.target).get('weight');if(raw==='')delete db.weights[s];else{let v=Number(raw);if(!Number.isFinite(v)||v<1||v>500)return alert('体重を確認してね');db.weights[s]=v}save();render()};$('healthNoteForm').querySelectorAll('[data-health-template]').forEach(b=>b.onclick=()=>{let ta=$('healthNoteForm').elements.memo;ta.value+=(ta.value?'\n\n':'')+b.dataset.healthTemplate;ta.focus()});$('healthNoteForm').onsubmit=e=>{e.preventDefault();const note=String(new FormData(e.target).get('memo')||'').trim();if(note)db.healthNotes[s]=note;else delete db.healthNotes[s];save();render()};$('editStampsHealth').onclick=stampSettings;$('other').querySelectorAll('[data-health-month]').forEach(b=>b.onclick=()=>{date=new Date(date.getFullYear(),date.getMonth()+Number(b.dataset.healthMonth),1);render()})}
function repeatOptions(v){return [['none','なし'],['daily','毎日'],['weekly','毎週'],['monthly','毎月']].map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('')}
function reminderCheckboxes(list){return [[10,'10分前'],[60,'1時間前'],[1440,'前日（同時刻）'],[2880,'2日前']].map(([v,l])=>`<label class="chip"><input type="checkbox" name="reminder" value="${v}" ${(list||[]).includes(v)?'checked':''}> ${l}</label>`).join('')}

function timePickerHTML(name,value){
 const match=/^(\d{2}):(\d{2})$/.exec(value||'');
 const h=match?Number(match[1]):9,m=match?Number(match[2]):0,step=[1,5,10].includes(Number(cfg.minuteStep))?Number(cfg.minuteStep):5;
 const hourOpts=Array.from({length:12},(_,i)=>`<option value="${i}" ${i===h%12?'selected':''}>${i===0?12:i}時</option>`).join('');
 const minOpts=Array.from({length:60/step},(_,i)=>{let n=i*step;return `<option value="${n}" ${n===Math.floor(m/step)*step?'selected':''}>${String(n).padStart(2,'0')}分</option>`}).join('');
 return `<div class="time-picker" data-time-picker="${name}">
   <div class="time-presets">${cfg.quickTimes.filter(v=>/^\d{2}:\d{2}$/.test(v)).slice(0,3).map(v=>`<button type="button" data-preset="${v}">${v}</button>`).join('')}</div>
   <div class="time-controls"><button type="button" data-clear-time>時刻なし</button>
   <select aria-label="午前・午後" data-period><option value="am" ${h<12?'selected':''}>午前</option><option value="pm" ${h>=12?'selected':''}>午後</option></select>
   <select aria-label="時" data-hour>${hourOpts}</select><select aria-label="分" data-minute>${minOpts}</select></div>
   <input type="hidden" name="${name}" value="${esc(value||'')}">
   <div class="hint time-summary">設定：${esc(value||'時刻なし')} · ${step}分刻み</div>
 </div>`;
}
function setupTimePickers(root){
 root.querySelectorAll('[data-time-picker]').forEach(box=>{
  const hidden=box.querySelector('input[type=hidden]'),period=box.querySelector('[data-period]'),hour=box.querySelector('[data-hour]'),minute=box.querySelector('[data-minute]'),summary=box.querySelector('.time-summary');
  const update=()=>{let h=Number(hour.value)+(period.value==='pm'?12:0),m=Number(minute.value);hidden.value=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');summary.textContent='設定：'+hidden.value+' · '+cfg.minuteStep+'分刻み'};
  [period,hour,minute].forEach(x=>x.onchange=update);
  box.querySelector('[data-clear-time]').onclick=()=>{hidden.value='';summary.textContent='設定：時刻なし'};
  box.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{let [h,m]=b.dataset.preset.split(':').map(Number);period.value=h>=12?'pm':'am';hour.value=h%12;minute.value=Math.floor(m/cfg.minuteStep)*cfg.minuteStep;update()});
 });
}

ettings)cfg=Object.assign(cfg,raw.settings);save();saveCfg();close();render()}}catch{alert('バックアップの形式を確認してください')}})};$('notifications').onclick=async()=>{if(!('Notification'in window))return alert('このブラウザは通知に対応していません');try{let r=await Notification.requestPermission();$('notificationStatus').textContent='通知の状態: '+r}catch{alert('この環境では通知を許可できません')}};$('test').onclick=()=>{setTimeout(()=>notify('たぬっき','テスト通知だよ。'),10000);$('notificationStatus').textContent='アプリを開いたまま10秒待ってね'};$('reset').onclick=()=>{if(confirm('本当にすべてのデータを削除しますか？')){db=blank();save();close();render()}}}

 events:async id=>(await getDocs(collection(store,'groups',id,'events'))).docs.map(clean),
 addEvent:async(id,data)=>{let u=api.user,eid=crypto.randomUUID();await setDoc(doc(store,'groups',id,'events',eid),{...data,ownerUid:u.uid,ownerName:(u.displayName||'メンバー').slice(0,80),createdAt:Date.now()})},
 removeEvent:async(id,eid)=>deleteDoc(doc(store,'groups',id,'events',eid))};
window.tanukkiCloud=api;
onAuthStateChanged(auth,u=>{api.user=u;window.dispatchEvent(new Event('tanukki-auth'))});
getRedirectResult(auth).catch(e=>{window.tanukkiCloudError=e.message});
</script></body></html>
