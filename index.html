{font-size:19px;margin:0 0 15px}.field{margin:13px 0}.field>label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input:not([type=checkbox]):not([type=radio]),.field textarea,.field select{width:100%;border:1px solid var(--line);background:#faf7f2;border-radius:12px;padding:12px;font-size:16px}.field textarea{min-height:72px}.field input[type=checkbox]{accent-color:var(--sage)}.buttons{display:flex;gap:8px;margin:15px 0}.buttons button{flex:1;background:#ece4da;border-radius:13px;padding:12px}.buttons .primary{background:var(--accent);color:white}.quick button{background:#eee7dd;border-radius:12px;padding:8px 10px;font-size:12px}.quick button.active{background:var(--sage);color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.swatches{display:flex;flex-wrap:wrap;gap:8px}.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.swatch.active{outline:2px solid var(--ink)}.hide{display:none!important}.mini-chart{display:flex;gap:5px;align-items:end;min-height:100px;border-bottom:1px solid var(--line);padding-top:10px}.bar{flex:1;min-width:4px;background:var(--sage);border-radius:4px 4px 0 0}.chartmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px}.notice{background:#f4ece3;padding:10px;border-radius:12px;font-size:12px;line-height:1.6;color:var(--muted)}

</style></head><body><div class="shell"><header><div><div class="logo">たぬっき 🍂</div><div class="subtitle">たぬの日々を、すこしずつ。</div></div><button class="pill" id="settings">⚙ 設定</button></header><div id="home"><section class="card"><div class="monthhead"><button id="prev">‹</button><strong id="monthTitle"></strong><button id="next">›</button></div><div class="cal" id="calendar"></div></section><div class="dayhead"><strong id="dateTitle"></strong><div class="daynav"><button class="tiny" id="dayPrev" aria-label="前日">‹</button><button class="tiny" id="today">今日</button><button class="tiny" id="dayNext" aria-label="翌日">›</button></div></div><section class="card"><h2>予定 <button data-add="event">＋ 追加</button></h2><div id="events"></div></section><section class="card"><h2>やること <button data-add="task">＋ 追加</button></h2><div id="tasks"></div></section><section class="card"><h2>体調スタンプ <button id="editStamps">⚙ カスタマイズ</button></h2><div class="stampgrid" id="stamps"></div><p class="hint">選んだ日の記録。押すと記録・解除できるよ。</p></section><section class="card"><h2>✧ いつかの楽しみ <button id="shuffleVision">別の目標</button></h2><div id="visionPreview" class="goal"></div></section></div><div id="other" class="hide"></div></div><nav><div><button data-view="home" class="active">⌂ ホーム</button><button data-view="tasks">☑ TODO</button><button data-view="wishes">♡ やりたい</button><button data-view="visions">✧ いつか</button><button data-view="health">☘ 体調</button><button data-view="share">♧ 共有</button></div></nav><div id="overlay" class="overlay hide"><div class="sheet" id="sheet"></div></div><script>
'use strict';
const KEY='tanukki-data-v1',SETKEY='tanukki-settings-v04';
const COLORS=['#b57e6b','#85937e','#8e94ad','#c6a36f','#b98fa2','#88837a'];
const blank=()=>({events:[],tasks:[],wishes:[],visions:[],stamps:[{id:'headache',name:'頭痛',emoji:'🤕'},{id:'period',name:'生理',emoji:'🌙'},{id:'sleepy',name:'眠気',emoji:'💤'},{id:'good',name:'好調',emoji:'🌿'}],health:{},weights:{}});
let db;try{db=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{db=blank()};for(const k of ['events','tasks','wishes','visions','stamps'])if(!Array.isArray(db[k]))db[k]=[];if(!db.health||typeof db.health!=='object')db.health={};if(!db.weights||typeof db.weights!=='object')db.weights={};
let cfg;try{cfg=Object.assign({weekStart:0,minuteStep:5,showDone:true,showVision:true,categories:['私用','仕事','通院','おでかけ','家族','その他']},JSON.parse(localStorage.getItem(SETKEY)||'{}'))}catch{cfg={weekStart:0,minuteStep:5,showDone:true,showVision:true,categories:['私用','仕事','通院','おでかけ','家族','その他']}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const saveCfg=()=>localStorage.setItem(SETKEY,JSON.stringify(cfg));let date=new Date(),view='home',visionId=null;date.setHours(0,0,0,0);const close=()=>$('overlay').classList.add('hide');function show(html){$('sheet').innerHTML=html;$('overlay').classList.remove('hide')};$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};
const catColor=cat=>COLORS[Math.max(0,cfg.categories.indexOf(cat))%COLORS.length];const categoryOptions=val=>cfg.categories.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join('');const dateLabel=d=>`${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('home').classList.toggle('hide',view!=='home');$('other').classList.toggle('hide',view==='home');if(view==='home')renderHome();else renderOther()}
function renderCalendar(){let y=date.getFullYear(),m=date.getMonth(),sel=iso(date),first=new Date(y,m,1),offset=(first.getDay()-cfg.weekStart+7)%7; $('monthTitle').textContent=`${y}年 ${m+1}月`;let c=Array.from({length:7},(_,i)=>`<span class="dow">${'日月火水木金土'[(i+cfg.weekStart)%7]}</span>`).join('');for(let i=0;i<offset;i++)c+='<span></span>';for(let n=1;n<=new Date(y,m+1,0).getDate();n++){const k=iso(new Date(y,m,n)),ev=db.events.filter(e=>e.date===k),h=(db.health[k]||[]).length,hasTask=db.tasks.some(t=>t.due===k);let dots=ev.slice(0,2).map(e=>`<i class="dot" style="background:${k===sel?'white':catColor(e.category)}"></i>`).join('');if(h)dots+=`<i class="dot" style="background:${k===sel?'white':'#b98fa2'}"></i>`;else if(hasTask)dots+=`<i class="dot" style="background:${k===sel?'white':'#c6a36f'}"></i>`;c+=`<button aria-label="${k}" data-day="${k}" class="${k===sel?'sel ':''}${k===iso(new Date())?'today':''}">${n}<span class="dots">${dots}</span></button>`} $('calendar').innerHTML=c}
function taskHTML(arr){return arr.map(t=>`<div class="entry"><input aria-label="完了" type="checkbox" class="check" data-check="${esc(t.id)}" ${t.done?'checked':''}><div class="main ${t.done?'done':''}"><strong>${esc(t.title)}</strong><small>${t.due?'期限 '+esc(t.due):'期限なし'}${t.repeat?' · 繰り返し '+esc(t.repeat):''}${t.reminderAt?' · 🔔 '+esc(t.reminderAt.replace('T',' ')):''}</small></div><button class="tiny" data-edit="task" data-id="${esc(t.id)}">編集</button></div>`).join('')}
function renderHome(){renderCalendar();$('dateTitle').textContent=dateLabel(date);const s=iso(date);let ev=db.events.filter(e=>e.date===s||isRepeatOn(e,s)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('events').innerHTML=ev.map(e=>`<div class="entry"><span class="colorbar" style="background:${catColor(e.category)}"></span><span class="time">${esc(e.time||'未定')}</span><div class="main"><strong>${esc(e.title)}</strong><small><span class="tag">${esc(e.category||'私用')}</span>${e.visibility==='private'?'🔒 自分だけ':e.visibility==='busy'?'時間のみ共有予定':'共有予定'}${e.repeat?' · ↻ '+esc(e.repeat):''}${e.note?' · '+esc(e.note):''}</small></div><button class="tiny" data-share-event="${esc(e.id)}">共有へ</button><button class="tiny" data-copy="${esc(e.id)}">複製</button><button class="tiny" data-edit="event" data-id="${esc(e.id)}">編集</button></div>`).join('')||'<div class="empty">予定はありません</div>';const tasks=db.tasks.filter(t=>(!t.done||cfg.showDone)&&(t.done||!t.due||t.due<=s||isRepeatOn(t,s))).slice(0,12);$('tasks').innerHTML=taskHTML(tasks)||'<div class="empty">TODOはありません</div>';$('stamps').innerHTML=db.stamps.map(x=>`<button class="stamp ${(db.health[s]||[]).includes(x.id)?'active':''}" data-stamp="${esc(x.id)}">${esc(x.emoji)} ${esc(x.name)}</button>`).join('')||'<div class="empty">スタンプを追加してね</div>';const goals=db.visions;if(!cfg.showVision){$('visionPreview').closest('.card').classList.add('hide')}else{$('visionPreview').closest('.card').classList.remove('hide');if(!goals.length){$('visionPreview').textContent='「いつか」に目標を登録すると、ここに表示されるよ。';$('shuffleVision').hidden=true}else{if(!goals.some(g=>g.id===visionId))visionId=goals[Math.floor(Math.random()*goals.length)].id;$('visionPreview').textContent=goals.find(g=>g.id===visionId).title;$('shuffleVision').hidden=goals.length<2}}}
function isRepeatOn(e,k){if(!e.repeat||e.repeat==='none'||!e.date||k<e.date)return false;let a=new Date(e.date+'T12:00:00'),b=new Date(k+'T12:00:00');let days=Math.round((b-a)/86400000);if(days<=0)return false;if(e.repeat==='daily')return true;if(e.repeat==='weekly')return days%7===0;if(e.repeat==='monthly')return a.getDate()===b.getDate();return false}
function renderOther(){if(view==='share'){renderShare();return}if(view==='health'){renderHealth();return}const titles={tasks:'TODO',wishes:'やりたいこと',visions:'いつか叶えたいこと'},key=view,list=db[key];$('other').innerHTML=`<section class="card"><h2>${titles[key]} <button data-add="${key==='tasks'?'task':key}">＋ 追加</button></h2>${key==='tasks'?taskHTML(list.filter(x=>!x.done||cfg.showDone)):list.map(x=>`<div class="entry"><div class="main"><strong>${esc(x.title)}</strong><small>🔒 個人のリスト</small></div><button class="tiny" data-promote="${key}" data-id="${esc(x.id)}">TODOへ</button><button class="tiny" data-edit="${key}" data-id="${esc(x.id)}">編集</button></div>`).join('')}${list.length?'':'<div class="empty">まだ何もありません</div>'}</section>`}
function renderHealth(){let s=iso(date),w=db.weights[s]??'',vals=Object.entries(db.weights).filter(([d,v])=>Number.isFinite(Number(v))&&Number(v)>0).sort(([a],[b])=>a.localeCompare(b)).slice(-14);let graph='';if(vals.length){let nums=vals.map(x=>Number(x[1])),lo=Math.min(...nums)-1,hi=Math.max(...nums)+1;graph=`<div class="mini-chart">${vals.map(([d,v])=>`<div class="bar" title="${esc(d)}: ${esc(v)}kg" style="height:${Math.max(6,((Number(v)-lo)/(hi-lo))*90)}px"></div>`).join('')}</div><div class="chartmeta"><span>${esc(vals[0][0])}</span><span>${esc(vals[vals.length-1][0])}</span></div><p class="hint">直近${vals.length}件 · 最小 ${Math.min(...nums)}kg / 最大 ${Math.max(...nums)}kg</p>`}else graph='<p class="empty">体重を記録するとグラフが出るよ</p>';$('other').innerHTML=`<div class="dayhead"><strong>${dateLabel(date)}</strong><div class="daynav"><button class="tiny" data-shift="-1">‹</button><button class="tiny" data-shift="0">今日</button><button class="tiny" data-shift="1">›</button></div></div><section class="card"><h2>体調スタンプ <button id="editStampsHealth">⚙ 編集</button></h2><div class="stampgrid">${db.stamps.map(x=>`<button class="stamp ${(db.health[s]||[]).includes(x.id)?'active':''}" data-stamp="${esc(x.id)}">${esc(x.emoji)} ${esc(x.name)}</button>`).join('')}</div></section><section class="card"><h2>体重の記録</h2><form id="weightForm"><div class="field"><label>体重（kg）・空欄で記録を削除</label><input name="weight" type="number" step="0.1" min="1" max="500" inputmode="decimal" value="${esc(w)}" placeholder="例：58.2"></div><div class="buttons"><button class="primary">この日の記録を保存</button></div></form></section><section class="card"><h2>体重の推移</h2>${graph}</section><p class="notice">体調と体重の記録は、この端末内に保存されます。家族共有機能はまだありません。</p>`;$('weightForm').onsubmit=e=>{e.preventDefault();let raw=new FormData(e.target).get('weight');if(raw==='')delete db.weights[s];else{let v=Number(raw);if(!Number.isFinite(v)||v<1||v>500)return alert('体重を確認してね');db.weights[s]=v}save();render()};$('editStampsHealth').onclick=stampSettings}
function repeatOptions(v){return [['none','なし'],['daily','毎日'],['weekly','毎週'],['monthly','毎月']].map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('')}
function reminderCheckboxes(list){return [[10,'10分前'],[60,'1時間前'],[1440,'前日（同時刻）'],[2880,'2日前']].map(([v,l])=>`<label class="chip"><input type="checkbox" name="reminder" value="${v}" ${(list||[]).includes(v)?'checked':''}> ${l}</label>`).join('')}
function eventForm(item){let e=item||{title:'',date:iso(date),time:'',note:'',visibility:'private',reminders:[],repeat:'none',category:'私用'};show(`<h2>${item?'予定を編集':'予定を追加'}</h2><form id="editform"><div class="field"><label>予定名</label><input name="title" required maxlength="100" value="${esc(e.title)}" placeholder="例：通院、友だちと会う"></div><div class="field"><label>日付</label><input type="date" name="date" required value="${esc(e.date)}"></div><div class="field"><label>時刻（任意・数字を直接入力できるよ）</label><input type="time" name="time" step="60" value="${esc(e.time)}"></div><div class="field"><label>カテゴリ（色は自動で付くよ）</label><select name="category">${categoryOptions(e.category||'私用')}</select></div><div class="field"><label>繰り返し</label><select name="repeat">${repeatOptions(e.repeat||'none')}</select></div><div class="field"><label>メモ</label><textarea name="note">${esc(e.note)}</textarea></div><div class="field"><label>公開範囲（共有機能はまだ未実装）</label><select name="visibility"><option value="private" ${e.visibility==='private'?'selected':''}>自分だけ</option><option value="busy" ${e.visibility==='busy'?'selected':''}>時間だけ共有（将来）</option><option value="shared" ${e.visibility==='shared'?'selected':''}>内容も共有（将来）</option></select></div><div class="field"><label>リマインダー（複数選択可・現在はアプリ起動中のみ）</label><div class="chips">${reminderCheckboxes(e.reminders)}</div></div><div class="buttons"><button type="button" id="cancel">戻る</button><button class="primary">保存</button></div>${item?'<div class="buttons"><button type="button" id="delete">削除</button><button type="button" id="duplicate">複製して保存</button></div>':''}</form>`);$('cancel').onclick=close;$('editform').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target),obj={id:item?.id||uid(),title:f.get('title').trim(),date:f.get('date'),time:f.get('time'),category:f.get('category'),repeat:f.get('repeat'),note:f.get('note'),visibility:f.get('visibility'),reminders:f.getAll('reminder').map(Number)};if(!obj.title)return;if(item)Object.assign(item,obj);else db.events.push(obj);save();close();render()};if(item){$('delete').onclick=()=>{if(confirm('この予定を削除しますか？')){db.events=db.events.filter(x=>x.id!==item.id);save();close();render()}};$('duplicate').onclick=()=>{let f=new FormData($('editform'));db.events.push({id:uid(),title:f.get('title').trim(),date:f.get('date'),time:f.get('time'),category:f.get('category'),repeat:f.get('repeat'),note:f.get('note'),visibility:f.get('visibility'),reminders:f.getAll('reminder').map(Number)});save();close();render()}}}

function notify(title,body){if('Notification'in window&&Notification.permission==='granted'){try{new Notification(title,{body,icon:'icon.svg'})}catch{alert(body)}}else alert(body)}const notified=new Set();function checkReminders(){let now=Date.now();for(let e of db.events){if(!e.time)continue;for(let offset=0;offset<35;offset++){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+offset);let k=iso(d);if(e.date!==k&&!isRepeatOn(e,k))continue;let when=new Date(`${k}T${e.time}:00`).getTime();for(let mins of e.reminders||[]){let target=when-mins*60000,key=e.id+':'+mins+':'+target;if(now>=target&&now<target+60000&&!notified.has(key)){notified.add(key);notify('たぬっき：'+e.title,mins>=1440?`${mins/1440}日前のお知らせ`:mins>=60?`${mins/60}時間前のお知らせ`:`${mins}分前のお知らせ`)}}}}for(let t of db.tasks){if(!t.reminderAt||t.done)continue;let when=new Date(t.reminderAt).getTime(),key=t.id+':'+when;if(now>=when&&now<when+60000&&!notified.has(key)){notified.add(key);notify('たぬっき：TODO',t.title)}}}setInterval(checkReminders,15000);
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.day){date=new Date(b.dataset.day+'T00:00:00');render()}else if(b.dataset.add){b.dataset.add==='event'?eventForm():itemForm(b.dataset.add)}else if(b.dataset.edit){let key=b.dataset.edit==='event'?'events':b.dataset.edit==='task'?'tasks':b.dataset.edit,item=db[key].find(x=>x.id===b.dataset.id);if(item)b.dataset.edit==='event'?eventForm(item):itemForm(b.dataset.edit,item)}else if(b.dataset.shareEvent){shareLocalEvent(b.dataset.shareEvent)}else if(b.dataset.copy){let item=db.events.find(x=>x.id===b.dataset.copy);if(item){let cp={...item,id:uid(),reminders:[...(item.reminders||[])]};db.events.push(cp);save();render();eventForm(cp)}}else if(b.dataset.stamp){let k=iso(date),a=db.health[k]||[];db.health[k]=a.includes(b.dataset.stamp)?a.filter(x=>x!==b.dataset.stamp):[...a,b.dataset.stamp];save();render()}else if(b.dataset.view){view=b.dataset.view;render()}else if(b.dataset.shift){date=b.dataset.shift==='0'?new Date():new Date(date.getFullYear(),date.getMonth(),date.getDate()+Number(b.dataset.shift));render()}else if(b.dataset.promote){let k=b.dataset.promote,item=db[k].find(x=>x.id===b.dataset.id);if(item){db.tasks.push({id:uid(),title:item.title,private:true,done:false,due:''});db[k]=db[k].filter(x=>x.id!==item.id);save();view='tasks';render()}}});document.addEventListener('change',e=>{if(e.target.dataset.check){let t=db.tasks.find(x=>x.id===e.target.dataset.check);if(t){t.done=e.target.checked;if(t.done&&t.repeat&&t.repeat!=='none'&&t.due){let d=new Date(t.due+'T12:00:00');if(t.repeat==='daily')d.setDate(d.getDate()+1);if(t.repeat==='weekly')d.setDate(d.getDate()+7);if(t.repeat==='monthly')d.setMonth(d.getMonth()+1);db.tasks.push({...t,id:uid(),done:false,due:iso(d),reminderAt:''})}save();render()}}});$('prev').onclick=()=>{date=new Date(date.getFullYear(),date.getMonth()-1,Math.min(date.getDate(),28));render()};$('next').onclick=()=>{date=new Date(date.getFullYear(),date.getMonth()+1,Math.min(date.getDate(),28));render()};$('dayPrev').onclick=()=>{date.setDate(date.getDate()-1);render()};$('dayNext').onclick=()=>{date.setDate(date.getDate()+1);render()};$('today').onclick=()=>{date=new Date();date.setHours(0,0,0,0);render()};$('shuffleVision').onclick=()=>{let list=db.visions.filter(x=>x.id!==visionId);if(list.length){visionId=list[Math.floor(Math.random()*list.length)].id;render()}};$('editStamps').onclick=stampSettings;$('settings').onclick=settings;if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,getDoc,getDocs,query,where,updateDoc,deleteDoc} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js';
const config={apiKey:'AIzaSyB2IALxLvIi-xmLA_zSz6II7jMKRZq0O-g',authDomain:'tanukki-91e53.firebaseapp.com',projectId:'tanukki-91e53',storageBucket:'tanukki-91e53.firebasestorage.app',messagingSenderId:'452181720798',appId:'1:452181720798:web:ce6ab7525ee45fa1b68c4f'};
const app=initializeApp(config),auth=getAuth(app),store=getFirestore(app),provider=new GoogleAuthProvider();
const clean=d=>({id:d.id,...d.data()});
const api={user:null,
 login:async()=>{try{await signInWithPopup(auth,provider)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code))await signInWithRedirect(auth,provider);else throw e}},
 logout:()=>signOut(auth),
 groups:async()=>{if(!api.user)return[];let q=query(collection(store,'groups'),where('members.'+api.user.uid,'==',true));return (await getDocs(q)).docs.map(clean)},
 createGroup:async name=>{let id=crypto.randomUUID(),uid=api.user.uid;await setDoc(doc(store,'groups',id),{name,owner:uid,members:{[uid]:true},createdAt:Date.now()});return id},
 requestJoin:async id=>{if(!/^[0-9a-f-]{36}$/i.test(id))throw Error('招待コードを確認してね');let u=api.user;await setDoc(doc(store,'groups',id,'requests',u.uid),{uid:u.uid,name:(u.displayName||'メンバー').slice(0,80),email:(u.email||'').slice(0,200),createdAt:Date.now()})},
 requests:async id=>(await getDocs(collection(store,'groups',id,'requests'))).docs.map(clean),
 approve:async(id,uid)=>{let g=await getDoc(doc(store,'groups',id));if(g.data()?.owner!==api.user.uid)throw Error('管理者だけが承認できるよ');await updateDoc(doc(store,'groups',id),{['members.'+uid]:true});await deleteDoc(doc(store,'groups',id,'requests',uid))},
 events:async id=>(await getDocs(collection(store,'groups',id,'events'))).docs.map(clean),
 addEvent:async(id,data)=>{let u=api.user,eid=crypto.randomUUID();await setDoc(doc(store,'groups',id,'events',eid),{...data,ownerUid:u.uid,ownerName:(u.displayName||'メンバー').slice(0,80),createdAt:Date.now()})},
 removeEvent:async(id,eid)=>deleteDoc(doc(store,'groups',id,'events',eid))};
window.tanukkiCloud=api;
onAuthStateChanged(auth,u=>{api.user=u;window.dispatchEvent(new Event('tanukki-auth'))});
getRedirectResult(auth).catch(e=>{window.tanukkiCloudError=e.message});
</script></body></html>
