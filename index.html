<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f0e8"><link rel="manifest" href="manifest.webmanifest"><title>たぬっき</title><style>
:root{--bg:#f5f0e8;--paper:#fffcf7;--ink:#4d4842;--muted:#8e8479;--line:#e7ddd0;--accent:#b57e6b;--sage:#85937e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:transparent}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.shell{max-width:560px;margin:auto;min-height:100dvh;padding:18px 16px 110px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.logo{font-size:27px;font-weight:700;letter-spacing:.08em}.subtitle,.muted{font-size:12px;color:var(--muted)}.pill,.tiny{background:#eee5da;border-radius:20px;padding:9px 12px}.tiny{font-size:12px;padding:7px 10px}.card{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #65503b09}.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.card h2 button{color:var(--accent);background:#f4ebe3;padding:7px 10px;border-radius:14px;font-size:12px}.monthhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.monthhead button{background:#f0e8de;border-radius:10px;padding:7px 14px}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}.cal button,.cal span{min-height:48px;border-radius:11px;position:relative;padding:5px 1px;font-size:13px}.cal .dow{min-height:23px;font-size:11px;color:var(--muted)}.cal button.today{outline:1px solid var(--accent)}.cal button.sel{background:var(--accent);color:white}.dots{display:flex;justify-content:center;gap:2px;min-height:6px;margin-top:3px}.dot{height:5px;width:5px;border-radius:50%;background:var(--sage)}.sel .dot{background:white}.dayhead{display:flex;align-items:center;justify-content:space-between;margin:17px 2px 6px}.dayhead strong{font-size:18px}.daynav{display:flex;gap:5px}.entry{display:flex;align-items:flex-start;gap:9px;padding:11px 0;border-top:1px solid var(--line)}.entry:first-child{border-top:0}.main{flex:1;min-width:0}.main strong{font-size:14px;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}.entry small{color:var(--muted);font-size:11px;display:block;margin-top:5px;line-height:1.5}.time{font-size:12px;color:var(--muted);min-width:43px}.colorbar{height:28px;width:4px;border-radius:3px;flex-shrink:0}.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 5px}.check{height:20px;width:20px;accent-color:var(--sage)}.done{text-decoration:line-through;color:#aaa}.stampgrid,.chips,.quick{display:flex;flex-wrap:wrap;gap:7px}.stamp,.chip{border-radius:14px;background:#f1eae1;padding:9px 11px;font-size:12px}.stamp.active,.chip.active{background:#dfe8da;outline:1px solid var(--sage)}.hint{font-size:12px;color:var(--muted);line-height:1.7}.healthline{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.goal{padding:8px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.preview{font-size:12px;color:var(--muted);line-height:1.7}.tag{display:inline-block;font-size:10px;border-radius:8px;background:#eee6dc;padding:2px 6px;margin-right:4px}nav{position:fixed;bottom:0;left:0;right:0;background:#f5f0e8f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:3}nav>div{display:flex;max-width:560px;margin:auto;justify-content:space-between}nav button{font-size:11px;color:var(--muted);padding:9px 6px}nav button.active{color:var(--accent);font-weight:700}.overlay{position:fixed;inset:0;background:#27221e77;z-index:6;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--paper);width:min(560px,100%);max-height:92dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(28px + env(safe-area-inset-bottom))}.sheet h2{font-size:19px;margin:0 0 15px}.field{margin:13px 0}.field>label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input:not([type=checkbox]):not([type=radio]),.field textarea,.field select{width:100%;border:1px solid var(--line);background:#faf7f2;border-radius:12px;padding:12px;font-size:16px}.field textarea{min-height:72px}.field input[type=checkbox]{accent-color:var(--sage)}.buttons{display:flex;gap:8px;margin:15px 0}.buttons button{flex:1;background:#ece4da;border-radius:13px;padding:12px}.buttons .primary{background:var(--accent);color:white}.quick button{background:#eee7dd;border-radius:12px;padding:8px 10px;font-size:12px}.quick button.active{background:var(--sage);color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.swatches{display:flex;flex-wrap:wrap;gap:8px}.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.swatch.active{outline:2px solid var(--ink)}.hide{display:none!important}.mini-chart{display:flex;gap:5px;align-items:end;min-height:100px;border-bottom:1px solid var(--line);padding-top:10px}.bar{flex:1;min-width:4px;background:var(--sage);border-radius:4px 4px 0 0}.chartmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px}.notice{background:#f4ece3;padding:10px;border-radius:12px;font-size:12px;line-height:1.6;color:var(--muted)}

/* v0.5: compact calendar, tactile dial, clearer controls */

.shell{padding-bottom:112px}header{gap:12px}.vision-header{font-size:11px;color:var(--muted);max-width:225px;line-height:1.45;margin-top:4px;cursor:pointer}.vision-header strong{font-weight:600;color:var(--ink)}
.cal{gap:2px}.cal button,.cal span{min-height:36px;padding:3px 1px}.cal .dow{min-height:20px}.cal button{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;font-size:12px;overflow:hidden}.cal .cal-label{display:block;max-width:100%;font-size:8px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:3px;padding:1px 2px;color:#4d4842;background:#e6d7cd}.cal .cal-more{font-size:8px;line-height:1;color:var(--muted)}.cal button.sel .cal-label{background:#f4e6dc}.cal button.sel .cal-more{color:white}.cal button.today{outline-offset:-1px}.cal button.sel{color:white}.cal button:after{display:none!important}
.card h2 button,[data-add]{background:var(--accent)!important;color:#fff!important;font-weight:650!important;box-shadow:0 2px 6px #65503b18}
.dial-nav{padding:7px 9px calc(10px + env(safe-area-inset-bottom))}.dial-shell{width:min(500px,100%);display:flex;align-items:center;gap:4px}.dial-arrow{background:#ebe0d5;border-radius:50%;width:38px;height:38px;flex-shrink:0;font-size:23px;color:var(--accent)}.dial-window{flex:1;overflow:hidden;touch-action:pan-y;user-select:none;position:relative}.dial-window:before,.dial-window:after{content:'';position:absolute;top:0;bottom:0;width:18%;z-index:1;pointer-events:none}.dial-window:before{left:0;background:linear-gradient(90deg,#f5f0e8,transparent)}.dial-window:after{right:0;background:linear-gradient(270deg,#f5f0e8,transparent)}.dial-track{display:flex;align-items:center;gap:7px;transition:transform .23s cubic-bezier(.2,.7,.25,1);will-change:transform}.dial-track button{flex:0 0 94px;white-space:nowrap;border-radius:14px;padding:12px 4px;color:var(--muted);font-size:12px;transition:background .2s,transform .2s}.dial-track button.active{background:#e7d7c9;color:#76513e;transform:scale(1.06);font-weight:700}.dial-track button.neighbor{opacity:.65}.health-cal button{min-height:48px}.health-cal .health-icons{font-size:10px;line-height:1.3;display:block;white-space:nowrap;max-width:100%;overflow:hidden}.health-cal .cal-label{font-size:8px}.quick-times{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.quick-times button{background:#eee5da;border-radius:10px;padding:8px 11px;font-size:12px}.category-filter{display:flex;gap:6px;overflow-x:auto;padding:3px 0 9px}.category-filter button{background:#f0e8de;border-radius:12px;padding:7px 10px;white-space:nowrap;font-size:12px}.category-filter button.active{background:var(--accent);color:white}.list-category{display:inline-block;margin-right:5px;border-radius:8px;background:#f0e8de;padding:2px 6px;font-size:10px;color:#786b5c}@media(prefers-reduced-motion:reduce){.dial-track,.dial-track button{transition:none}}

</style></head><body><div class="shell"><header><div><div class="logo">たぬっき 🍂</div><div id="visionHeader" class="vision-header"></div><div class="subtitle">たぬの日々を、すこしずつ。</div></div><div style="display:flex;gap:6px;align-items:center"><span class="pointbox" id="tanupo">🍂 0 たぬぽ</span><button class="pill" id="settings">⚙ 設定</button></div></header><div id="home"><section class="card"><div class="monthhead"><button id="prev">‹</button><strong id="monthTitle"></strong><button id="next">›</button></div><div class="cal" id="calendar"></div></section><div class="dayhead"><strong id="dateTitle"></strong><div class="daynav"><button class="tiny" id="dayPrev" aria-label="前日">‹</button><button class="tiny" id="today">今日</button><button class="tiny" id="dayNext" aria-label="翌日">›</button></div></div><section class="card"><h2>予定 <button data-add="event">＋ 追加</button></h2><div id="events"></div></section><section class="card"><h2>やること <button data-add="task">＋ 追加</button></h2><div id="tasks"></div></section></div><div id="other" class="hide"></div></div><nav class="dial-nav" aria-label="画面の切り替え"><div class="dial-shell"><button type="button" class="dial-arrow" id="dialPrev" aria-label="前のタブ">‹</button><div class="dial-window" id="dialWindow"><div class="dial-track" id="dialTrack"><button data-view="home">⌂ ホーム</button><button data-view="tasks">☑ TODO</button><button data-view="wishes">♡ やりたい</button><button data-view="visions">✧ いつか</button><button data-view="health">☘ 体調</button><button data-view="share">♧ 共有</button></div></div><button type="button" class="dial-arrow" id="dialNext" aria-label="次のタブ">›</button></div></nav><div id="overlay" class="overlay hide"><div class="sheet" id="sheet"></div></div><script>
'use strict';
const KEY='tanukki-data-v1',SETKEY='tanukki-settings-v04';
const COLORS=['#b57e6b','#85937e','#8e94ad','#c6a36f','#b98fa2','#88837a'];
const blank=()=>({events:[],tasks:[],wishes:[],visions:[],stamps:[{id:'headache',name:'頭痛',emoji:'🤕'},{id:'period',name:'生理',emoji:'🌙'},{id:'sleepy',name:'眠気',emoji:'💤'},{id:'good',name:'好調',emoji:'🌿'}],health:{},weights:{}});
let db;try{db=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{db=blank()};for(const k of ['events','tasks','wishes','visions','stamps'])if(!Array.isArray(db[k]))db[k]=[];if(!db.health||typeof db.health!=='object')db.health={};if(!db.weights||typeof db.weights!=='object')db.weights={};
let cfg;try{cfg=Object.assign({weekStart:0,minuteStep:5,showDone:true,showVision:true,categories:['私用','仕事','通院','おでかけ','家族','その他']},JSON.parse(localStorage.getItem(SETKEY)||'{}'))}catch{cfg={weekStart:0,minuteStep:5,showDone:true,showVision:true,categories:['私用','仕事','通院','おでかけ','家族','その他']}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const saveCfg=()=>localStorage.setItem(SETKEY,JSON.stringify(cfg));let date=new Date(),view='home',visionId=null;let holidays={};fetch('https://holidays-jp.github.io/api/v1/date.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{holidays=x;render()}).catch(()=>{});date.setHours(0,0,0,0);const close=()=>$('overlay').classList.add('hide');function show(html){$('sheet').innerHTML=html;$('overlay').classList.remove('hide')};$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};
const catColor=cat=>COLORS[Math.max(0,cfg.categories.indexOf(cat))%COLORS.length];const categoryOptions=val=>cfg.categories.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join('');const dateLabel=d=>`${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;
function render(){document.body.dataset.view=view;$('tanupo').textContent='🍂 '+db.tasks.filter(t=>t.done).length+' たぬぽ';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('home').classList.toggle('hide',view!=='home');$('other').classList.toggle('hide',view==='home');if(view==='home')renderHome();else renderOther();renderVisionHeader();renderDial()}
function renderCalendar(){let y=date.getFullYear(),m=date.getMonth(),sel=iso(date),first=new Date(y,m,1),offset=(first.getDay()-cfg.weekStart+7)%7;$('monthTitle').textContent=`${y}年 ${m+1}月`;let c=Array.from({length:7},(_,i)=>`<span class="dow">${'日月火水木金土'[(i+cfg.weekStart)%7]}</span>`).join('');for(let i=0;i<offset;i++)c+='<span></span>';for(let n=1;n<=new Date(y,m+1,0).getDate();n++){let k=iso(new Date(y,m,n)),ev=db.events.filter(e=>eventOnDate(e,k)),h=0,hasTask=db.tasks.some(t=>t.due===k);let detail=ev.length?`<span class="cal-label" style="background:${catColor(ev[0].category)}35">${esc(ev[0].title)}</span>`:hasTask?'<span class="cal-label">☑ TODO</span>':'';let more=ev.length>1?`<span class="cal-more">+${ev.length-1}</span>`:'';c+=`<button aria-label="${k} ${esc(ev.map(x=>x.title).join('、'))}" data-day="${k}" class="${k===sel?'sel ':''}${k===iso(new Date())?'today ':''}${holidays[k]?'holiday':''}">${n}${holidays[k]?`<span class="holiday-tag">${esc(holidays[k])}</span>`:''}${detail}${more}</button>`}$('calendar').innerHTML=c}

function taskHTML(arr){return arr.map(t=>`<div class="entry"><input aria-label="完了" type="checkbox" class="check" data-check="${esc(t.id)}" ${t.done?'checked':''}><div class="main ${t.done?'done':''}"><strong>${esc(t.title)}</strong><small><span class="list-category">${esc(t.category||'その他')}</span>${t.due?'期限 '+esc(t.due):'期限なし'}${t.repeat?' · 繰り返し '+esc(t.repeat):''}${t.reminderAt?' · 🔔 '+esc(t.reminderAt.replace('T',' ')):''}</small></div><button class="tiny" data-edit="task" data-id="${esc(t.id)}">編集</button></div>`).join('')}
const tabOrder=['home','tasks','wishes','visions','health','share'];let dialStartX=null;function renderDial(){let i=tabOrder.indexOf(view),track=$('dialTrack'),win=$('dialWindow');if(!track||!win)return;let buttons=[...track.querySelectorAll('[data-view]')];buttons.forEach((b,j)=>{b.classList.toggle('active',j===i);b.classList.toggle('neighbor',Math.abs(j-i)===1);b.setAttribute('aria-current',j===i?'page':'false')});let center=buttons[i].offsetLeft+buttons[i].offsetWidth/2;track.style.transform=`translateX(${win.clientWidth/2-center}px)`}function dialStep(n){let i=tabOrder.indexOf(view);view=tabOrder[(i+n+tabOrder.length)%tabOrder.length];render()}function renderVisionHeader(){let el=$('visionHeader');if(!el)return;if(!cfg.showVision){el.hidden=true;return}el.hidden=false;let goals=db.visions||[];if(!goals.length){el.innerHTML='<span>✧ いつかの楽しみを登録しよう</span>';return}if(!goals.some(g=>g.id===visionId))visionId=goals[Math.floor(Math.random()*goals.length)].id;el.innerHTML=`✧ いつかの楽しみ　<strong>${esc(goals.find(g=>g.id===visionId).title)}</strong>`}
function renderHome(){renderCalendar();$('dateTitle').textContent=dateLabel(date);const s=iso(date);let ev=db.events.filter(e=>eventOnDate(e,s)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('events').innerHTML=ev.map(e=>`<div class="entry"><span class="colorbar" style="background:${catColor(e.category)}"></span><span class="time">${esc(e.time||'未定')}${e.endTime?`<span class="endline">〜${esc(e.endTime)}${e.endDate&&e.endDate!==e.date?'（翌日以降）':''}</span>`:''}</span><div class="main"><strong>${esc(e.title)}</strong><small><span class="tag">${esc(e.category||'私用')}</span>${e.visibility==='private'?'🔒 自分だけ':e.visibility==='busy'?'時間のみ共有予定':'共有予定'}${e.repeat?' · ↻ '+esc(e.repeat):''}${e.note?' · '+esc(e.note):''}</small></div><button class="tiny" data-copy="${esc(e.id)}">複製</button><button class="tiny" data-edit="event" data-id="${esc(e.id)}">編集</button></div>`).join('')||'<div class="empty">予定はありません</div>';const tasks=db.tasks.filter(t=>(!t.done||cfg.showDone)&&(t.done||!t.due||t.due<=s||isRepeatOn(t,s))).slice(0,12);$('tasks').innerHTML=taskHTML(tasks)||'<div class="empty">TODOはありません</div>';renderVisionHeader()}
function eventOnDate(e,k){if(!e.date)return false;if(isRepeatOn(e,k))return true;return k>=e.date&&k<=(e.endDate||e.date)}
function isRepeatOn(e,k){if(!e.repeat||e.repeat==='none'||!e.date||k<e.date)return false;let a=new Date(e.date+'T12:00:00'),b=new Date(k+'T12:00:00');let days=Math.round((b-a)/86400000);if(days<=0)return false;if(e.repeat==='daily')return true;if(e.repeat==='weekly')return days%7===0;if(e.repeat==='monthly')return a.getDate()===b.getDate();return false}
function renderOther(){if(view==='health'){renderHealth();return}if(view==='share'){renderShare();return}const titles={tasks:'TODO',wishes:'やりたいこと',visions:'いつか叶えたいこと'},key=view,list=db[key],filter=listFilters[key]||'すべて';const chips=['すべて',...listCategories].map(x=>`<button class="${filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('');let filtered=list.filter(x=>(filter==='すべて'||(x.category||'その他')===filter));$('other').innerHTML=`<section class="card"><h2>${titles[key]} <button data-add="${key==='tasks'?'task':key}">＋ 追加</button></h2><div class="category-filter">${chips}</div>${key==='tasks'?taskHTML(filtered.filter(x=>!x.done||cfg.showDone)):filtered.map(x=>`<div class="entry"><div class="main"><strong>${esc(x.title)}</strong><small><span class="list-category">${esc(x.category||'その他')}</span> 🔒 個人のリスト</small></div><button class="tiny" data-promote="${key}" data-id="${esc(x.id)}">TODOへ</button><button class="tiny" data-edit="${key}" data-id="${esc(x.id)}">編集</button></div>`).join('')}${filtered.length?'':'<div class="empty">このカテゴリにはまだ何もありません</div>'}</section>`}

function healthCalendarHTML(){let y=date.getFullYear(),m=date.getMonth(),offset=(new Date(y,m,1).getDay()-cfg.weekStart+7)%7,html=Array.from({length:7},(_,i)=>`<span class="dow">${'日月火水木金土'[(i+cfg.weekStart)%7]}</span>`).join('');for(let i=0;i<offset;i++)html+='<span></span>';for(let n=1;n<=new Date(y,m+1,0).getDate();n++){let k=iso(new Date(y,m,n)),st=db.health[k]||[],icons=st.map(id=>db.stamps.find(x=>x.id===id)?.emoji||'•').slice(0,3).join(''),weight=db.weights[k];html+=`<button data-day="${k}" class="${k===iso(date)?'sel ':''}${k===iso(new Date())?'today':''}">${n}<span class="health-icons">${esc(icons)}</span>${weight?'<span class="cal-label">'+esc(weight)+'kg</span>':''}</button>`}return html}
function renderHealth(){let s=iso(date),w=db.weights[s]??'',vals=Object.entries(db.weights).filter(([d,v])=>Number.isFinite(Number(v))&&Number(v)>0).sort(([a],[b])=>a.localeCompare(b)).slice(-14);let graph='';if(vals.length){let nums=vals.map(x=>Number(x[1])),lo=Math.min(...nums)-1,hi=Math.max(...nums)+1;graph=`<div class="mini-chart">${vals.map(([d,v])=>`<div class="bar" title="${esc(d)}: ${esc(v)}kg" style="height:${Math.max(6,((Number(v)-lo)/(hi-lo))*90)}px"></div>`).join('')}</div><div class="chartmeta"><span>${esc(vals[0][0])}</span><span>${esc(vals[vals.length-1][0])}</span></div><p class="hint">直近${vals.length}件 · 最小 ${Math.min(...nums)}kg / 最大 ${Math.max(...nums)}kg</p>`}else graph='<p class="empty">体重を記録するとグラフが出るよ</p>';$('other').innerHTML=`<section class="card"><div class="monthhead"><button data-health-month="prev">‹</button><strong>${date.getFullYear()}年 ${date.getMonth()+1}月 · 体調</strong><button data-health-month="next">›</button></div><div class="cal health-cal">${healthCalendarHTML()}</div><p class="hint">スタンプを記録した日がひと目でわかるよ。</p></section><div class="dayhead"><strong>${dateLabel(date)}</strong><div class="daynav"><button class="tiny" data-shift="-1">‹</button><button class="tiny" data-shift="0">今日</button><button class="tiny" data-shift="1">›</button></div></div><section class="card"><h2>体調スタンプ <button id="editStampsHealth">⚙ 編集</button></h2><div class="stampgrid">${db.stamps.map(x=>`<button class="stamp ${(db.health[s]||[]).includes(x.id)?'active':''}" data-stamp="${esc(x.id)}">${esc(x.emoji)} ${esc(x.name)}</button>`).join('')}</div></section><section class="card"><h2>体重の記録</h2><form id="weightForm"><div class="field"><label>体重（kg）・空欄で記録を削除</label><input name="weight" type="number" step="0.1" min="1" max="500" inputmode="decimal" value="${esc(w)}" placeholder="例：58.2"></div><div class="buttons"><button class="primary">この日の記録を保存</button></div></form></section><section class="card"><h2>体重の推移</h2>${graph}</section><p class="notice">体調と体重の記録は、この端末内に保存されます。オンライン共有はまだ接続されていません。</p>`;$('weightForm').onsubmit=e=>{e.preventDefault();let raw=new FormData(e.target).get('weight');if(raw==='')delete db.weights[s];else{let v=Number(raw);if(!Number.isFinite(v)||v<1||v>500)return alert('体重を確認してね');db.weights[s]=v}save();render()};$('editStampsHealth').onclick=stampSettings}
function renderShare(){$('other').innerHTML=`<section class="card"><h2>♧ 共有カレンダー</h2><p class="hint">グループのカレンダーを切り替えて見るための準備画面だよ。</p><div class="share-preview"><strong>🔒 個人用モード</strong><p class="hint">まだオンライン共有には接続していません。招待や他の人との同期は使えません。</p></div><p class="hint">認証とデータベースの設定が済んだら、グループ作成・招待・メンバーごとの表示切り替えを追加するよ。体調は共有しません。</p></section>`}
function repeatOptions(v){return [['none','なし'],['daily','毎日'],['weekly','毎週'],['monthly','毎月']].map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('')}
function reminderCheckboxes(list){return [[10,'10分前'],[60,'1時間前'],[1440,'前日（同時刻）'],[2880,'2日前']].map(([v,l])=>`<label class="chip"><input type="checkbox" name="reminder" value="${v}" ${(list||[]).includes(v)?'checked':''}> ${l}</label>`).join('')}
function eventForm(item){let e=item||{title:'',date:iso(date),time:'',note:'',visibility:'private',reminders:[],repeat:'none',category:'私用'};show(`<h2>${item?'予定を編集':'予定を追加'}</h2><form id="editform"><div class="field"><label>予定名</label><input name="title" required maxlength="100" value="${esc(e.title)}" placeholder="例：通院、友だちと会う"></div><div class="field"><label>日付</label><input type="date" name="date" required value="${esc(e.date)}"></div><div class="field"><label>時刻（任意・数字を直接入力できるよ）</label><input type="time" name="time" step="60" value="${esc(e.time)}"><div class="quick-times"><button type="button" data-quick-time="09:00">9:00</button><button type="button" data-quick-time="12:00">12:00</button><button type="button" data-quick-time="18:00">18:00</button><button type="button" data-quick-time="">時刻なし</button></div></div><div class="field"><label>終了日（任意・日を跨ぐとき）</label><input type="date" name="endDate" value="${esc(e.endDate||'')}"></div><div class="field"><label>終了時刻（任意）</label><input type="time" name="endTime" value="${esc(e.endTime||'')}"></div><div class="field"><label>カテゴリ（色は自動で付くよ）</label><select name="category">${categoryOptions(e.category||'私用')}</select></div><div class="field"><label>繰り返し</label><select name="repeat">${repeatOptions(e.repeat||'none')}</select></div><div class="field"><label>メモ</label><textarea name="note">${esc(e.note)}</textarea></div><div class="field"><label>公開範囲（共有機能はまだ未実装）</label><select name="visibility"><option value="private" ${e.visibility==='private'?'selected':''}>自分だけ</option><option value="busy" ${e.visibility==='busy'?'selected':''}>時間だけ共有（将来）</option><option value="shared" ${e.visibility==='shared'?'selected':''}>内容も共有（将来）</option></select></div><div class="field"><label>リマインダー（複数選択可・現在はアプリ起動中のみ）</label><div class="chips">${reminderCheckboxes(e.reminders)}</div></div><div class="buttons"><button type="button" id="cancel">戻る</button><button class="primary">保存</button></div>${item?'<div class="buttons"><button type="button" id="delete">削除</button><button type="button" id="duplicate">複製して保存</button></div>':''}</form>`);$('cancel').onclick=close;$('editform').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target),obj={id:item?.id||uid(),title:f.get('title').trim(),date:f.get('date'),time:f.get('time'),endDate:f.get('endDate'),endTime:f.get('endTime'),category:f.get('category'),repeat:f.get('repeat'),note:f.get('note'),visibility:f.get('visibility'),reminders:f.getAll('reminder').map(Number)};if(!obj.title)return;if(obj.endDate&&obj.endDate<obj.date)return alert('終了日は開始日以降にしてね');if(obj.endTime&&!obj.time)return alert('終了時刻を入れる場合は開始時刻も入力してね');if(obj.endTime&&(!obj.endDate||obj.endDate===obj.date)&&obj.endTime<obj.time)return alert('翌日に終わる場合は終了日も指定してね');if(item)Object.assign(item,obj);else db.events.push(obj);save();close();render()};if(item){$('delete').onclick=()=>{if(confirm('この予定を削除しますか？')){db.events=db.events.filter(x=>x.id!==item.id);save();close();render()}};$('duplicate').onclick=()=>{let f=new FormData($('editform'));db.events.push({id:uid(),title:f.get('title').trim(),date:f.get('date'),time:f.get('time'),endDate:f.get('endDate'),endTime:f.get('endTime'),category:f.get('category'),repeat:f.get('repeat'),note:f.get('note'),visibility:f.get('visibility'),reminders:f.getAll('reminder').map(Number)});save();close();render()}}}
const listCategories=['生活','仕事','趣味','その他'];let listFilters={tasks:'すべて',wishes:'すべて',visions:'すべて'};function listCategoryOptions(v){return listCategories.map(x=>`<option value="${x}" ${x===(v||'その他')?'selected':''}>${x}</option>`).join('')}function itemForm(kind,item){const key=kind==='task'?'tasks':kind;show(`<h2>${item?'編集':{tasks:'TODO',wishes:'やりたいこと',visions:'いつか叶えたいこと'}[key]+'を追加'}</h2><form id="editform"><div class="field"><label>内容</label><textarea name="title" required maxlength="200">${esc(item?.title||'')}</textarea></div><div class="field"><label>ざっくりカテゴリ</label><select name="category">${listCategoryOptions(item?.category)}</select></div>${key==='tasks'?`<div class="field"><label>期限（任意）</label><input type="date" name="due" value="${esc(item?.due||'')}"></div><div class="field"><label>繰り返し（期限を設定した場合）</label><select name="repeat">${repeatOptions(item?.repeat||'none')}</select></div><div class="field"><label>通知日時（任意・アプリ起動中のみ）</label><input type="datetime-local" name="reminderAt" value="${esc(item?.reminderAt||'')}"></div>`:''}<p class="hint">このリストは個人用。家族とは共有されません。</p><div class="buttons"><button type="button" id="cancel">戻る</button><button class="primary">保存</button></div>${item?'<div class="buttons"><button type="button" id="delete">削除</button></div>':''}</form>`);$('cancel').onclick=close;$('editform').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target),obj={id:item?.id||uid(),title:f.get('title').trim(),private:true,category:f.get('category')||'その他'};if(!obj.title)return;if(key==='tasks'){obj.done=item?.done||false;obj.due=f.get('due')||'';obj.repeat=f.get('repeat');obj.reminderAt=f.get('reminderAt')||''}if(item)Object.assign(item,obj);else db[key].push(obj);save();close();render()};if(item)$('delete').onclick=()=>{if(confirm('削除しますか？')){db[key]=db[key].filter(x=>x.id!==item.id);save();close();render()}}}
function stampSettings(){show(`<h2>体調スタンプの設定</h2><p class="hint">名前と絵文字を自由に設定できるよ。</p><div id="stampList">${db.stamps.map(x=>`<div class="entry"><div class="main"><strong>${esc(x.emoji)} ${esc(x.name)}</strong></div><button class="tiny" data-remove-stamp="${esc(x.id)}">削除</button></div>`).join('')}</div><form id="stampForm"><div class="field"><label>絵文字</label><input name="emoji" maxlength="8" value="🌸" required></div><div class="field"><label>スタンプ名</label><input name="name" maxlength="25" placeholder="例：肩こり" required></div><div class="buttons"><button type="button" id="cancel">閉じる</button><button class="primary">追加</button></div></form>`);$('cancel').onclick=close;$('stampForm').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target);db.stamps.push({id:uid(),emoji:f.get('emoji').trim(),name:f.get('name').trim()});save();stampSettings();render()};$('stampList').onclick=ev=>{let b=ev.target.closest('[data-remove-stamp]');if(b&&confirm('スタンプを削除しますか？')){db.stamps=db.stamps.filter(x=>x.id!==b.dataset.removeStamp);save();stampSettings();render()}}}
function settings(){show(`<h2>たぬっきの設定</h2><div class="field"><label>週の始まり</label><select id="weekStart"><option value="0" ${cfg.weekStart===0?'selected':''}>日曜日</option><option value="1" ${cfg.weekStart===1?'selected':''}>月曜日</option></select></div><div class="field"><label>時刻の分刻み（入力補助用・ブラウザにより表示が異なります）</label><select id="minuteStep"><option value="1" ${cfg.minuteStep===1?'selected':''}>1分</option><option value="5" ${cfg.minuteStep===5?'selected':''}>5分</option><option value="10" ${cfg.minuteStep===10?'selected':''}>10分</option></select></div><div class="field"><label><input type="checkbox" id="showDone" ${cfg.showDone?'checked':''}> 完了済みTODOも表示する</label></div><div class="field"><label><input type="checkbox" id="showVision" ${cfg.showVision?'checked':''}> ホームに「いつか」を表示する</label></div><div class="field"><label>予定カテゴリ（1行に1つ・最大6個）</label><textarea id="categories">${esc(cfg.categories.join('\n'))}</textarea><p class="hint">カテゴリの順番に6色のくすみカラーが割り当てられるよ。</p></div><div class="buttons"><button class="primary" id="saveSettings">設定を保存</button><button id="cancel">閉じる</button></div><p class="notice">データはこのブラウザの端末内に保存されます。更新前にバックアップを取ってね。オンライン共有とバックグラウンド通知は未実装です。</p><div class="buttons"><button id="export">バックアップ保存</button><button id="importButton">読み込む</button></div><input type="file" id="importFile" accept="application/json" class="hide"><div class="buttons"><button id="notifications">通知を許可</button><button id="test">10秒後にテスト</button></div><p class="hint" id="notificationStatus">通知はアプリを開いている間だけ動作します。</p><div class="buttons"><button id="reset">すべて消去</button></div>`);$('cancel').onclick=close;$('saveSettings').onclick=()=>{cfg.weekStart=Number($('weekStart').value);cfg.minuteStep=Number($('minuteStep').value);cfg.showDone=$('showDone').checked;cfg.showVision=$('showVision').checked;cfg.categories=$('categories').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,6);if(!cfg.categories.length)cfg.categories=['私用'];saveCfg();close();render()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({format:'tanukki-backup-v04',data:db,settings:cfg},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tanukki-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=ev=>{let file=ev.target.files[0];if(!file)return;file.text().then(t=>{try{let raw=JSON.parse(t),d=raw.data||raw;if(!Array.isArray(d.events)||!Array.isArray(d.tasks)||!Array.isArray(d.stamps))throw Error();if(confirm('現在のデータをバックアップで置き換えますか？')){db=Object.assign(blank(),d);if(raw.settings)cfg=Object.assign(cfg,raw.settings);save();saveCfg();close();render()}}catch{alert('バックアップの形式を確認してください')}})};$('notifications').onclick=async()=>{if(!('Notification'in window))return alert('このブラウザは通知に対応していません');try{let r=await Notification.requestPermission();$('notificationStatus').textContent='通知の状態: '+r}catch{alert('この環境では通知を許可できません')}};$('test').onclick=()=>{setTimeout(()=>notify('たぬっき','テスト通知だよ。'),10000);$('notificationStatus').textContent='アプリを開いたまま10秒待ってね'};$('reset').onclick=()=>{if(confirm('本当にすべてのデータを削除しますか？')){db=blank();save();close();render()}}}
function notify(title,body){if('Notification'in window&&Notification.permission==='granted'){try{new Notification(title,{body,icon:'icon.svg'})}catch{alert(body)}}else alert(body)}const notified=new Set();function checkReminders(){let now=Date.now();for(let e of db.events){if(!e.time)continue;for(let offset=0;offset<35;offset++){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+offset);let k=iso(d);if(e.date!==k&&!isRepeatOn(e,k))continue;let when=new Date(`${k}T${e.time}:00`).getTime();for(let mins of e.reminders||[]){let target=when-mins*60000,key=e.id+':'+mins+':'+target;if(now>=target&&now<target+60000&&!notified.has(key)){notified.add(key);notify('たぬっき：'+e.title,mins>=1440?`${mins/1440}日前のお知らせ`:mins>=60?`${mins/60}時間前のお知らせ`:`${mins}分前のお知らせ`)}}}}for(let t of db.tasks){if(!t.reminderAt||t.done)continue;let when=new Date(t.reminderAt).getTime(),key=t.id+':'+when;if(now>=when&&now<when+60000&&!notified.has(key)){notified.add(key);notify('たぬっき：TODO',t.title)}}}setInterval(checkReminders,15000);
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.quickTime!==undefined){let input=document.querySelector('#editform [name=time]');if(input)input.value=b.dataset.quickTime}else if(b.dataset.healthMonth){date=new Date(date.getFullYear(),date.getMonth()+(b.dataset.healthMonth==='next'?1:-1),Math.min(date.getDate(),28));render()}else if(b.dataset.filter){listFilters[view]=b.dataset.filter;render()}else if(b.dataset.day){date=new Date(b.dataset.day+'T00:00:00');render()}else if(b.dataset.add){b.dataset.add==='event'?eventForm():itemForm(b.dataset.add)}else if(b.dataset.edit){let key=b.dataset.edit==='event'?'events':b.dataset.edit==='task'?'tasks':b.dataset.edit,item=db[key].find(x=>x.id===b.dataset.id);if(item)b.dataset.edit==='event'?eventForm(item):itemForm(b.dataset.edit,item)}else if(b.dataset.copy){let item=db.events.find(x=>x.id===b.dataset.copy);if(item){let cp={...item,id:uid(),reminders:[...(item.reminders||[])]};db.events.push(cp);save();render();eventForm(cp)}}else if(b.dataset.stamp){let k=iso(date),a=db.health[k]||[];db.health[k]=a.includes(b.dataset.stamp)?a.filter(x=>x!==b.dataset.stamp):[...a,b.dataset.stamp];save();render()}else if(b.dataset.view){view=b.dataset.view;render()}else if(b.dataset.shift){date=b.dataset.shift==='0'?new Date():new Date(date.getFullYear(),date.getMonth(),date.getDate()+Number(b.dataset.shift));render()}else if(b.dataset.promote){let k=b.dataset.promote,item=db[k].find(x=>x.id===b.dataset.id);if(item){db.tasks.push({id:uid(),title:item.title,private:true,done:false,due:'',category:item.category||'その他'});db[k]=db[k].filter(x=>x.id!==item.id);save();view='tasks';render()}}});document.addEventListener('change',e=>{if(e.target.dataset.check){let t=db.tasks.find(x=>x.id===e.target.dataset.check);if(t){t.done=e.target.checked;if(t.done&&t.repeat&&t.repeat!=='none'&&t.due){let d=new Date(t.due+'T12:00:00');if(t.repeat==='daily')d.setDate(d.getDate()+1);if(t.repeat==='weekly')d.setDate(d.getDate()+7);if(t.repeat==='monthly')d.setMonth(d.getMonth()+1);db.tasks.push({...t,id:uid(),done:false,due:iso(d),reminderAt:''})}save();render()}}});$('dialPrev').onclick=()=>dialStep(-1);$('dialNext').onclick=()=>dialStep(1);$('dialWindow').addEventListener('touchstart',e=>{dialStartX=e.touches[0].clientX},{passive:true});$('dialWindow').addEventListener('touchend',e=>{if(dialStartX===null)return;let dx=e.changedTouches[0].clientX-dialStartX;dialStartX=null;if(Math.abs(dx)>28)dialStep(dx<0?1:-1)},{passive:true});window.addEventListener('resize',renderDial);$('visionHeader').onclick=()=>{view='visions';render()};$('prev').onclick=()=>{date=new Date(date.getFullYear(),date.getMonth()-1,Math.min(date.getDate(),28));render()};$('next').onclick=()=>{date=new Date(date.getFullYear(),date.getMonth()+1,Math.min(date.getDate(),28));render()};$('dayPrev').onclick=()=>{date.setDate(date.getDate()-1);render()};$('dayNext').onclick=()=>{date.setDate(date.getDate()+1);render()};$('today').onclick=()=>{date=new Date();date.setHours(0,0,0,0);render()};$('settings').onclick=settings;if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
