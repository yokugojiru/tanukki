/* v0.9: compact calendar and tactile dial */
.cal > button,.cal > span{min-height:34px}
.cal > button{gap:0;padding:2px 1px}
.cal .dow{min-height:15px}
.cal-num{font-size:11px;line-height:13px;min-height:13px}
.cal-events{min-height:0;gap:0}
.cal-event{font-size:6px;line-height:1.12;padding-left:2px;letter-spacing:-.15px}
.holiday-mark{position:absolute;right:2px;top:2px;width:4px;height:4px;border-radius:50%;background:#c78378}
.cal button.sel .holiday-mark{background:white}
.health-emojis{display:flex;justify-content:center;align-items:center;gap:1px;overflow:hidden;white-space:nowrap;font-size:10px;line-height:15px;min-height:15px}
.health-memo-mark{position:absolute;right:2px;bottom:1px;width:3px;height:3px;border-radius:50%;background:#85937e}
.cal > button{position:relative}
nav .dial-track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;gap:6px;max-width:360px;padding:3px 10px;overflow:visible;touch-action:pan-y;user-select:none}
nav .dial-track button{min-width:0;width:100%;flex:auto;padding:9px 2px;font-size:11px;transition:transform .16s ease,opacity .16s ease,background .16s ease}
nav .dial-track button.dial-side{opacity:.55;transform:scale(.86)}
nav .dial-track button.active{opacity:1;transform:scale(1.03);box-shadow:0 2px 7px #6b50402b}
nav .dial-track button.dial-hidden{visibility:hidden}
nav .dial-track.dial-bump-left{animation:dial-bump-left .2s ease}
nav .dial-track.dial-bump-right{animation:dial-bump-right .2s ease}
@keyframes dial-bump-left{50%{transform:translateX(-9px)}}
@keyframes dial-bump-right{50%{transform:translateX(9px)}}
.dial-hint{font-size:9px;padding-top:1px}
.health-note{width:100%;min-height:75px;resize:vertical}

/* v1.0 usability */

.cal-event{display:block;width:100%;min-width:0;max-width:100%;font-size:8px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;padding:1px 0;background:transparent!important;border:0!important;border-radius:0!important}

div><div class="dial-hint">左右にスワイプ、または左右をタップ</div></nav><div id="overlay" class="overlay hide"><div class="sheet" id="sheet"></div></div><script>

;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};

  setTimeout(()=>el.remove(),1400);

const catColor=cat=>COLORS[Math.max(0,cfg.categories.indexOf(cat))%COLORS.length];const categoryOptions=val=>cfg.categories.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join('');const dateLabel=d=>`${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;
const dialViews=['home','tasks','wishes','visions'];
const dialNames={'home':'⌂ ホーム','tasks':'☑ やること','wishes':'♡ やりたい','visions':'✧ いつか'};
let dialLastView='home';
function moveDial(step){
  const idx=dialViews.indexOf(dialLastView);
  const next=(idx+step+dialViews.length)%dialViews.length;
  if(next===idx)return;
  dialLastView=dialViews[next];view=dialLastView;render();
  const track=$('dialTrack');track.classList.remove('dial-bump-left','dial-bump-right');
  void track.offsetWidth;
  track.classList.add(step>0?'dial-bump-left':'dial-bump-right');
}
function syncDial(){
  if(dialViews.includes(view))dialLastView=view;
  const i=dialViews.indexOf(dialLastView),prev=$('dialPrev'),current=$('dialCurrent'),next=$('dialNext');
  prev.textContent='‹ '+dialNames[dialViews[(i-1+dialViews.length)%dialViews.length]];
  current.textContent=dialNames[dialLastView];
  next.textContent=dialNames[dialViews[(i+1)%dialViews.length]]+' ›';
  prev.disabled=false;next.disabled=false;
  prev.className='dial-side';
  current.className='active';
  next.className='dial-side';
}

function render(){if($('tanupoBadge')){$('tanupoBadge').hidden=!cfg.showTanupo;$('tanupoBadge').textContent='✦ '+tanupoCount()+' たぬぽ'}document.body.dataset.page=view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('home').classList.toggle('hide',view!=='home');$('other').classList.toggle('hide',view==='home');if(view==='home')renderHome();else renderOther();syncDial()}
const holidayCacheKey='tanukki-holidays-v1';let holidays={};try{holidays=JSON.parse(localStorage.getItem(holidayCacheKey)||'{}')}catch{};
async function loadHolidays(){if(!cfg.showHolidays&&!cfg.tintHolidays)return;try{const r=await fetch('https://holidays-jp.github.io/api/v1/date.json',{cache:'force-cache'});if(!r.ok)throw Error('holiday fetch');const data=await r.json();if(data&&typeof data==='object'){holidays=data;localStorage.setItem(holidayCacheKey,JSON.stringify(data));render()}}catch(e){console.info('祝日データはオフラインのためキャッシュを使用',e)}}
function scopedEvents(k){
 if(calendarScope==='private')return db.events.filter(e=>e.date===k||isSpanOn(e,k)||isRepeatOn(e,k));

}
function refreshScopeSelect(){const el=$('calendarScope');if(!el)return;const prev=calendarScope;el.innerHTML='<option value="private">自分の予定</option>'+shareGroups.map(g=>`<option value="${esc(g.id)}">♧ ${esc(g.name)}</option>`).join('');if(shareUser()&&shareGroups.length){const remembered=localStorage.getItem(SCOPEKEY)||'private';if(calendarScope==='private'&&remembered!=='private'&&shareGroups.some(g=>g.id===remembered))calendarScope=remembered;if(calendarScope!=='private'&&!shareGroups.some(g=>g.id===calendarScope)){calendarScope='private';localStorage.setItem(SCOPEKEY,'private')}}else if(!shareUser()){calendarScope='private'}el.value=calendarScope;}
const HEALTH_ICON_PATHS={
 headache:'<path d="M9 18h6M10 22h4M9 3a7 7 0 0 0-4 12c1 1 2 2 2 4h10c0-2 1-3 2-4A7 7 0 0 0 9 3Z"/>',
 period:'<path d="M12 3C9 8 6 11 6 15a6 6 0 0 0 12 0c0-4-3-7-6-12Z"/>',
 sleepy:'<path d="M20 15.2A8 8 0 0 1 8.8 4 8 8 0 1 0 20 15.2Z"/>',
 good:'<path d="M20 4C10 4 5 9 5 15a5 5 0 0 0 5 5c6 0 10-6 10-16ZM5 20c3-6 6-9 11-12"/>',
 fever:'<path d="M14 14V5a3 3 0 0 0-6 0v9a5 5 0 1 0 6 0ZM11 10v8"/>',
 sick:'<circle cx="12" cy="12" r="9"/><path d="M8 10h.01M16 10h.01M8 17c2-3 6-3 8 0"/>',
 smile:'<circle cx="12" cy="12" r="9"/><path d="M8 10h.01M16 10h.01M8 15c2 3 6 3 8 0"/>',

};
function healthIcon(stamp){
 const id=String(stamp?.id||'').toLowerCase(),name=String(stamp?.name||''),emoji=String(stamp?.emoji||'');
 let key=HEALTH_ICON_PATHS[id]?id:/頭痛|偏頭痛/.test(name)?'headache':/生理|腹痛/.test(name)?'period':/眠|睡眠|疲/.test(name)?'sleepy':/元気|好調|快調/.test(name)?'good':/熱|発熱/.test(name)?'fever':/気分|憂鬱|落ち込/.test(name)?'cloud':/吐き気|不調|風邪/.test(name)?'sick':/嬉|楽しい/.test(name)?'smile':/♡|❤️|💗/.test(emoji)?'heart':'circle';
 return `<svg class="health-outline-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${HEALTH_ICON_PATHS[key]}</svg>`;
}
function calendarHTML(healthMode=false){
 const y=date.getFullYear(),m=date.getMonth(),sel=iso(date),first=new Date(y,m,1),offset=(first.getDay()-cfg.weekStart+7)%7;
 const weekStartDate=new Date(date);weekStartDate.setDate(date.getDate()-((date.getDay()-cfg.weekStart+7)%7));
 const cells=[];
 if(!healthMode&&cfg.calendarRange==='week'){for(let i=0;i<7;i++){const d=new Date(weekStartDate);d.setDate(weekStartDate.getDate()+i);cells.push(d)}}
 else {for(let i=0;i<offset;i++)cells.push(null);for(let n=1;n<=new Date(y,m+1,0).getDate();n++)cells.push(new Date(y,m,n))}
 let c=Array.from({length:7},(_,i)=>`<span class="dow">${'日月火水木金土'[(i+cfg.weekStart)%7]}</span>`).join('');
 for(const d of cells){
  if(!d){c+='<span></span>';continue}
  const k=iso(d),day=d.getDay(),hName=holidays[k],ev=scopedEvents(k),st=db.health[k]||[],weekend=day===0||day===6;
  const classes=[k===sel?'sel':'',k===iso(new Date())?'today':'',cfg.tintWeekends&&weekend?(day===0?'sunday':'saturday'):'',cfg.tintHolidays&&hName?'holiday-tint':''].filter(Boolean).join(' ');
  let contents='';

  else if(cfg.calendarMode==='dots')contents=`<span class="cal-dots">${ev.map(e=>`<i style="background:${calendarScope==='private'?catColor(e.category):memberColor(e.ownerUid)}"></i>`).join('')}</span>`;
  
  else contents=ev.length?`<span class="cal-events"><span class="cal-event" style="color:${calendarScope==='private'?catColor(ev[0].category):memberColor(ev[0].ownerUid)}">${esc(ev[0].title)}</span>${ev.length>1?`<span class="cal-count">+${ev.length-1}</span>`:''}</span>`:'';
  c+=`<button aria-label="${k}${hName?' '+esc(hName):''}" data-day="${k}" class="${classes}"><span class="cal-num">${d.getDate()}</span>${contents}</button>`;
 }

}
function renderCalendar(){refreshScopeSelect();$('monthTitle').textContent=cfg.calendarRange==='week'?`${date.getFullYear()}年 ${date.getMonth()+1}月 · 週`:`${date.getFullYear()}年 ${date.getMonth()+1}月`;$('calendar').innerHTML=calendarHTML();$('calendarModeToggle').textContent=cfg.calendarRange==='week'?'週':'月';$('pinArea').innerHTML=pinHTML()}
function isSpanOn(e,k){return !!(e.endDate&&e.date&&e.date<=k&&k<=e.endDate)}
function taskHTML(arr){return arr.map(t=>`<div class="entry"><input aria-label="完了" type="checkbox" class="check" data-check="${esc(t.id)}" ${t.done?'checked':''}><div class="main ${t.done?'done':''}"><strong>${esc(t.title)}</strong><small><span class="tag">${esc(t.category||'未分類')}</span>${t.due?'期限 '+esc(t.due):'期限なし'}${t.repeat?' · 繰り返し '+esc(t.repeat):''}${t.reminderAt?' · 🔔 '+esc(t.reminderAt.replace('T',' ')):''}</small></div><button class="tiny ${t.todayOnly?'today-picked':''}" data-today-task="${esc(t.id)}">${t.todayOnly?'今日✓':'今日やる'}</button><button class="tiny" data-edit="task" data-id="${esc(t.id)}">編集</button></div>`).join('')}
function renderHome(){renderCalendar();$('dateTitle').textContent=dateLabel(date);const s=iso(date);let ev=scopedEvents(s).sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('events').innerHTML=ev.map(e=>`<div class="entry"><span class="colorbar" style="background:${calendarScope==='private'?catColor(e.category):memberColor(e.ownerUid)}"></span><span class="time">${esc(e.time||'未定')}</span><div class="main"><strong>${esc(e.title)}</strong><small><span class="tag">${esc(e.category||'私用')}</span>${e.groupId?'♧ '+esc(e.groupName||'共有')+' · '+esc(memberName(e)):e.sharedGroup?'♧ '+esc(shareGroups.find(g=>g.id===e.sharedGroup)?.name||'共有中'):'🔒 自分だけ'}${e.repeat?' · ↻ '+esc(e.repeat):''}${e.note?' · '+esc(e.note):''}</small></div>${e.groupId?(e.ownerUid===shareUser()?.uid?`<button class="tiny" data-edit-shared="${esc(e.groupId)}" data-shared-id="${esc(e.id)}">編集</button>`:''):`<button class="tiny" data-copy="${esc(e.id)}">複製</button><button class="tiny" data-edit="event" data-id="${esc(e.id)}">編集</button>`}</div>`).join('')||'<div class="empty">予定はありません</div>';const tasks=db.tasks.filter(t=>(!t.done||cfg.showDone)&&(t.todayOnly||t.done||!t.due||t.due<=s||isRepeatOn(t,s))).slice(0,12);$('tasks').innerHTML=taskHTML(tasks)||'<div class="empty">TODOはありません</div>';const goals=db.visions;if(!cfg.showVision){$('visionCard').classList.add('hide')}else{$('visionCard').classList.remove('hide');if(!goals.length){$('visionPreview').textContent='「いつか」に目標を登録すると、ここに表示されるよ。';$('shuffleVision').hidden=true}else{if(!goals.some(g=>g.id===visionId))visionId=goals[Math.floor(Math.random()*goals.length)].id;$('visionPreview').textContent=goals.find(g=>g.id===visionId).title;$('shuffleVision').hidden=goals.length<2}}}
function isRepeatOn(e,k){if(!e.repeat||e.repeat==='none'||!e.date||k<e.date)return false;let a=new Date(e.date+'T12:00:00'),b=new Date(k+'T12:00:00');let days=Math.round((b-a)/86400000);if(days<=0)return false;if(e.repeat==='daily')return true;if(e.repeat==='weekly')return days%7===0;if(e.repeat==='monthly')return a.getDate()===b.getDate();return false}

function timePickerHTML(name,value){
 const match=/^(\d{2}):(\d{2})$/.exec(value||'');
 const h=match?Number(match[1]):9,m=match?Number(match[2]):0,step=[1,5,10].includes(Number(cfg.minuteStep))?Number(cfg.minuteStep):5;
 const hourOpts=Array.from({length:12},(_,i)=>`<option value="${i}" ${i===h%12?'selected':''}>${i===0?12:i}時</option>`).join('');
 const minOpts=Array.from({length:60/step},(_,i)=>{let n=i*step;return `<option value="${n}" ${n===Math.floor(m/step)*step?'selected':''}>${String(n).padStart(2,'0')}分</option>`}).join('');
 return `<div class="time-picker" data-time-picker="${name}">
   <div class="time-presets">${cfg.quickTimes.filter(v=>/^\d{2}:\d{2}$/.test(v)).slice(0,3).map(v=>`<button type="button" data-preset="${v}">${v}</button>`).join('')}</div>
   <div class="time-controls"><button type="button" data-clear-time>時刻なし</button>
   <select aria-label="午前・午後" data-period><option value="am" ${h<12?'selected':''}>午前</option><option value="pm" ${h>=12?'selected':''}>午後</option></select>
   <select aria-label="時" data-hour>${hourOpts}</select><select aria-label="分" data-minute>${minOpts}</select></div>
   <input type="hidden" name="${name}" value="${esc(value||'')}">
   <div class="hint time-summary">設定：${esc(value||'時刻なし')} · ${step}分刻み</div>
 </div>`;
}
function setupTimePickers(root){
 root.querySelectorAll('[data-time-picker]').forEach(box=>{
  const hidden=box.querySelector('input[type=hidden]'),period=box.querySelector('[data-period]'),hour=box.querySelector('[data-hour]'),minute=box.querySelector('[data-minute]'),summary=box.querySelector('.time-summary');
  const update=()=>{let h=Number(hour.value)+(period.value==='pm'?12:0),m=Number(minute.value);hidden.value=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');summary.textContent='設定：'+hidden.value+' · '+cfg.minuteStep+'分刻み'};
  [period,hour,minute].forEach(x=>x.onchange=update);
  box.querySelector('[data-clear-time]').onclick=()=>{hidden.value='';summary.textContent='設定：時刻なし'};
  box.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{let [h,m]=b.dataset.preset.split(':').map(Number);period.value=h>=12?'pm':'am';hour.value=h%12;minute.value=Math.floor(m/cfg.minuteStep)*cfg.minuteStep;update()});
 });
}

function batchCopyDialog(item){

 const span=item.endDate?Math.round((new Date(item.endDate+'T12:00:00')-base)/86400000):null;

ates[t.id]=iso(new Date());celebrateTanupo()}if(t.done&&t.repeat&&t.repeat!=='none'&&t.due){let d=new Date(t.due+'T12:00:00');if(t.repeat==='daily')d.setDate(d.getDate()+1);if(t.repeat==='weekly')d.setDate(d.getDate()+7);if(t.repeat==='monthly')d.setMonth(d.getMonth()+1);db.tasks.push({...t,id:uid(),done:false,due:iso(d),reminderAt:''})}save();render()}}});$('calendarScope').onchange=e=>{calendarScope=e.target.value;localStorage.setItem(SCOPEKEY,calendarScope);render()};$('scopeRefresh').onclick=async()=>{await loadShare();render()};$('calendarModeToggle').onclick=()=>{cfg.calendarRange=cfg.calendarRange==='week'?'month':'week';saveCfg();render()};
